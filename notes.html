<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartNotes • SyllaStudy AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --glass-blur: 40px;
    --text-main: #fff;
    --text-dim: rgba(255,255,255,0.6);
    --spring: cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html { overflow-x:hidden; }
  body { font-family:'DM Sans',sans-serif; background:linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.8)),url("https://images.unsplash.com/photo-1694543739066-7e1057e1165a?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"); background-size:cover; background-position:center; background-attachment:fixed; color:var(--text-main); min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden; }

  /* ── NAV ── */
  nav { height:64px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(255,255,255,0.05); border-bottom:1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,4vw,48px); z-index:200; flex-shrink:0; position:sticky; top:0; }
  .logo { font-family:'Lora',serif; font-size:18px; font-weight:700; letter-spacing:-0.3px; text-decoration:none; color:#fff; white-space:nowrap; }
  .nav-links { display:flex; align-items:center; gap:2px; }
  .nav-links a { color:#fff; text-decoration:none; padding:7px 13px; font-size:13.5px; font-weight:500; opacity:0.65; border-radius:20px; white-space:nowrap; transition:0.25s; }
  .nav-links a:hover, .nav-links a.active { opacity:1; background:rgba(255,255,255,0.1); }
  .nav-burger { display:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:38px; height:38px; border-radius:10px; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .nav-burger svg { width:17px;height:17px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round; }
  .mobile-drawer { display:none; flex-direction:column; position:fixed; top:64px; left:0; right:0; background:rgba(8,8,16,0.97); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border-bottom:1px solid rgba(255,255,255,0.1); z-index:199; padding:10px 16px 18px; gap:3px; }
  .mobile-drawer.open { display:flex; }
  .mobile-drawer a { color:rgba(255,255,255,0.75); text-decoration:none; font-size:15px; font-weight:500; padding:13px 16px; border-radius:12px; transition:0.2s; }
  .mobile-drawer a.active, .mobile-drawer a:hover { background:rgba(255,255,255,0.09); color:#fff; }

  /* ── LAYOUT ── */
  .app-container { display:flex; flex:1; padding:clamp(14px,2vw,24px); gap:clamp(12px,1.5vw,20px); min-height:0; overflow:hidden; }

  /* ── SIDEBAR ── */
  .notes-sidebar { width:clamp(220px,22vw,280px); background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur)); border:1px solid var(--glass-border); border-radius:24px; display:flex; flex-direction:column; padding:18px 12px; gap:12px; flex-shrink:0; min-height:0; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,0.2); }
  .sidebar-header { display:flex; align-items:center; justify-content:space-between; padding:0 4px; }
  .sidebar-header h2 { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; opacity:0.45; }
  .new-note-btn { background:rgba(255,255,255,0.9); color:#111; border:none; width:30px; height:30px; border-radius:50%; font-size:20px; font-weight:300; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.25s var(--spring); flex-shrink:0; }
  .new-note-btn:hover { transform:scale(1.1) rotate(90deg); background:#fff; }
  .notes-search { position:relative; }
  .notes-search input { width:100%; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:11px; padding:8px 12px 8px 32px; color:#fff; font-size:13px; font-family:'DM Sans',sans-serif; outline:none; transition:0.2s; }
  .notes-search input::placeholder { color:rgba(255,255,255,0.35); }
  .notes-search input:focus { border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); }
  .notes-search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:0.4; pointer-events:none; }

  /* ── QUOTA ── */
  .quota-bar-wrap { padding:0 4px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
  .quota-row { display:flex; align-items:center; justify-content:space-between; }
  .quota-label { font-size:10.5px; color:rgba(255,255,255,0.38); letter-spacing:0.04em; }
  .quota-count { font-size:10.5px; font-weight:600; color:rgba(255,255,255,0.55); font-variant-numeric:tabular-nums; transition:color 0.3s; }
  .quota-count.warn { color:rgba(251,191,36,0.85); }
  .quota-count.full { color:rgba(255,90,90,0.9); }
  .quota-track { height:3px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; }
  .quota-fill { height:100%; border-radius:99px; background:rgba(255,255,255,0.3); transition:width 0.4s cubic-bezier(0.4,0,0.2,1),background 0.3s; }
  .quota-fill.warn { background:rgba(251,191,36,0.7); }
  .quota-fill.full { background:rgba(255,90,90,0.8); }

  /* ── NOTES LIST ── */
  .notes-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:3px; scrollbar-width:none; }
  .notes-list::-webkit-scrollbar { display:none; }
  .note-item { padding:11px 12px; border-radius:12px; cursor:pointer; transition:0.18s; border:1px solid transparent; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .note-item:hover { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.1); }
  .note-item.active { background:rgba(255,255,255,0.14); border-color:var(--glass-border); }
  .note-item-content { flex:1; min-width:0; }
  .note-title-preview { font-size:13.5px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-snippet { font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-date { font-size:10.5px; color:rgba(255,255,255,0.3); margin-top:4px; }
  .delete-btn { background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; font-size:16px; padding:2px 4px; border-radius:6px; transition:0.2s; flex-shrink:0; opacity:0; line-height:1; }
  .note-item:hover .delete-btn { opacity:1; }
  .delete-btn:hover { color:rgba(255,90,90,0.85); background:rgba(255,90,90,0.12); }
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.4; font-size:13px; text-align:center; gap:8px; padding:20px; }

  /* ── EDITOR WORKSPACE ── */
  .editor-workspace { flex:1; background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur)); border:1px solid var(--glass-border); border-radius:24px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,0.2); min-height:0; min-width:0; }
  #editorContainer { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  /* ── DYNAMIC EDITOR (injected by JS) ── */
  .no-note-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; opacity:0.5; gap:14px; padding:40px 20px; }
  .no-note-placeholder p { font-size:14px; color:var(--text-dim); }
  .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:3px; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
  .tool-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.75); padding:5px 9px; border-radius:7px; font-size:12px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:0.15s; white-space:nowrap; }
  .tool-btn:hover { background:rgba(255,255,255,0.14); color:#fff; }
  .tool-sep { width:1px; height:18px; background:rgba(255,255,255,0.12); margin:0 3px; flex-shrink:0; }
  .autosave-indicator { margin-left:auto; font-size:11px; color:rgba(255,255,255,0.4); display:flex; align-items:center; gap:5px; opacity:0; transition:opacity 0.3s; }
  .autosave-indicator.show { opacity:1; }
  .autosave-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,200,80,0.8); animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .editor-wrapper { flex:1; display:flex; flex-direction:column; position:relative; min-height:0; overflow:hidden; }
  .editor-body { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:clamp(20px,3vw,40px) clamp(20px,4vw,56px); scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent; }
  .editor-body::-webkit-scrollbar { width:5px; }
  .editor-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:10px; }
  .document-title { background:transparent; border:none; color:#fff; font-family:'Lora',serif; font-size:clamp(20px,2.5vw,28px); font-weight:600; outline:none; width:100%; margin-bottom:18px; }
  .document-title::placeholder { color:rgba(255,255,255,0.2); }
  .rich-text { flex:1; min-height:200px; color:rgba(255,255,255,0.88); font-family:'DM Sans',sans-serif; font-size:clamp(14px,1.6vw,15.5px); line-height:1.8; outline:none; }
  .rich-text:empty::before { content:attr(placeholder); color:rgba(255,255,255,0.2); pointer-events:none; }
  .rich-text h1 { font-family:'Lora',serif; font-size:1.6em; margin-bottom:0.5em; }
  .rich-text h2 { font-family:'Lora',serif; font-size:1.3em; margin-bottom:0.4em; }
  .rich-text p { margin-bottom:0.8em; }
  .rich-text ul, .rich-text ol { padding-left:1.5em; margin-bottom:0.8em; }
  .ai-processing-overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:10; border-radius:0 0 24px 24px; }
  .ai-processing-overlay.show { display:flex; }
  .ai-spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,0.15); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .ai-processing-overlay p { font-size:14px; color:rgba(255,255,255,0.8); }
  .editor-footer { padding:9px 18px; border-top:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:8px; font-size:11.5px; color:rgba(255,255,255,0.28); flex-shrink:0; }

  /* ── TRANSFORM MODAL ── */
  .transform-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); z-index:500; align-items:center; justify-content:center; padding:20px; }
  .transform-modal.show { display:flex; }
  .modal-card { background:rgba(18,18,24,0.95); border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:24px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:16px; animation:fadeUp 0.25s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .modal-header { display:flex; align-items:center; justify-content:space-between; }
  .modal-title-text { font-size:15px; font-weight:600; }
  .modal-close-x { background:none; border:none; color:rgba(255,255,255,0.45); font-size:20px; cursor:pointer; padding:2px 6px; border-radius:6px; line-height:1; transition:0.2s; }
  .modal-close-x:hover { color:#fff; background:rgba(255,255,255,0.1); }
  .modal-options { display:flex; flex-direction:column; gap:6px; }
  .modal-option { padding:10px 14px; border-radius:11px; cursor:pointer; font-size:13.5px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); transition:0.18s; }
  .modal-option:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.18); }
  .modal-option.selected { background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.35); color:#fff; }
  .modal-actions { display:flex; gap:8px; }
  .modal-cancel-btn { flex:1; padding:11px; background:transparent; border:1px solid rgba(255,255,255,0.14); border-radius:11px; color:rgba(255,255,255,0.6); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:0.2s; }
  .modal-cancel-btn:hover { background:rgba(255,255,255,0.07); color:#fff; }
  .modal-apply-btn { flex:2; padding:11px; background:rgba(255,255,255,0.9); border:none; border-radius:11px; color:#000; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:0.2s; }
  .modal-apply-btn:hover:not(:disabled) { background:#fff; }
  .modal-apply-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .modal-apply-btn.loading { opacity:0.6; cursor:wait; }

  /* ── TOAST ── */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(14px); background:rgba(20,20,25,0.92); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.12); border-radius:100px; padding:10px 20px; font-size:13px; font-weight:500; color:#fff; opacity:0; pointer-events:none; transition:0.3s; z-index:9999; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  .site-footer { flex-shrink:0; margin:0 16px 16px; border-radius:16px; backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); padding:14px clamp(16px,3vw,36px); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .footer-copy { font-size:12px; color:rgba(255,255,255,0.3); }
  .footer-nav { display:flex; align-items:center; gap:4px; flex-wrap:wrap; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:12px; padding:4px 5px; }
  .footer-nav a { font-size:12px; font-weight:500; color:rgba(255,255,255,0.38); text-decoration:none; padding:5px 10px; border-radius:18px; border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03); transition:0.22s; }
  .footer-nav a:hover { color:rgba(255,255,255,0.85); background:rgba(255,255,255,0.08); }
  .footer-sep { width:1px; height:12px; background:rgba(255,255,255,0.12); margin:0 3px; }

  /* ── RESPONSIVE ── */
  @media (max-width:800px) {
    .nav-links { display:none; }
    .nav-burger { display:flex; }
    .app-container { flex-direction:column; overflow:auto; height:auto; padding:12px; gap:12px; }
    .notes-sidebar { width:100%; max-height:220px; border-radius:18px; padding:14px 12px; }
    .editor-workspace { min-height:480px; border-radius:18px; }
    .toolbar { padding:8px 10px; gap:2px; }
    .tool-btn { font-size:11px; padding:5px 7px; }
    .editor-body { padding:16px; }
    .site-footer { flex-direction:column; align-items:flex-start; }
  }
  @media (max-width:480px) {
    .tool-sep { display:none; }
    .document-title { font-size:18px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">SyllaStudy AI</a>
  <div class="nav-links">
    <a href="index.html">Dashboard</a><a href="chat.html">Study AI</a>

  </div>
  <button class="nav-burger" onclick="toggleDrawer()" aria-label="Menu">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</nav>
<div class="mobile-drawer" id="drawer">
  <a href="index.html">Dashboard</a><a href="chat.html">Study AI</a>
  <a href="notes.html" class="active">SmartNotes</a><a href="quiz.html">QuizGen</a>
  <a href="taskflow.html">TaskFlow</a><a href="about.html">About</a>
</div>

<div class="app-container">
  <!-- Sidebar -->
  <aside class="notes-sidebar">
    <div class="sidebar-header">
      <h2>My Notes</h2>
      <button class="new-note-btn" id="newNoteBtn" title="New note">+</button>
    </div>
    <div class="notes-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search notes…">
    </div>
    <div class="quota-bar-wrap">
      <div class="quota-row">
        <span class="quota-label">Saved notes</span>
        <span class="quota-count" id="notesQuotaCount">0 / 25</span>
      </div>
      <div class="quota-track"><div class="quota-fill" id="notesQuotaFill" style="width:0%"></div></div>
    </div>
    <div class="notes-list" id="noteList"></div>
  </aside>

  <!-- Editor -->
  <main class="editor-workspace">
    <div id="editorContainer"></div>
  </main>
</div>

<!-- Transform Modal -->
<div class="transform-modal" id="transformModal">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title-text" id="modalTitle">Transform</span>
      <button class="modal-close-x" id="modalCloseBtn">×</button>
    </div>
    <div class="modal-options" id="modalOptions"></div>
    <div class="modal-actions">
      <button class="modal-cancel-btn" id="modalCancelBtn">Cancel</button>
      <button class="modal-apply-btn" id="applyBtn">Apply</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <span class="footer-copy">© 2026 SyllaStudy AI</span>
  <nav class="footer-nav">
    <a href="index.html">Home</a><a href="about.html">About</a>
    <div class="footer-sep"></div>
    <a href="terms.html">Terms</a><a href="privacy.html">Privacy</a>
  </nav>
</footer>

<div class="toast" id="toast"></div>

<script>
window.SUPABASE_URL = window.SUPABASE_URL || '';
window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }
document.addEventListener('click', e => {
  const d = document.getElementById('drawer');
  if (!d.contains(e.target) && !e.target.closest('.nav-burger')) d.classList.remove('open');
});
</script>
<script type="module" src="js/pages/notes-page.js"></script>
