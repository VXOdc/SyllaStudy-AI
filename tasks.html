<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks • SyllaStudy-ai</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-blur: 40px;
            --accent-glow: rgba(255, 255, 255, 0.35);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.45)), 
                        url('https://images6.alphacoders.com/526/526622.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        nav {
            height: 80px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            opacity: 0.9;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 40px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0.7;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-links a:hover, .nav-links a.active { 
            opacity: 1; 
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* Task App Layout */
        main {
            flex: 1;
            padding: 60px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .task-container {
            width: 100%;
            max-width: 650px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 30px; 
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .task-header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .task-stats {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 16px 24px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.9);
            color: black;
            border: none;
            padding: 0 30px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: white;
            transform: scale(1.05);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.3s;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .task-item.completed {
            opacity: 0.5;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            color: transparent;
        }

        .task-item.completed .checkbox {
            background: white;
            border-color: white;
            color: black;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
        }

        .delete-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ff5a5a;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 16px;
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">SyllaStudy-ai</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Study AI</a>
            <a href="notes.html">Notes</a>
            <a href="tasks.html" class="active">Tasks</a>
            <a href="focus.html">Focus</a>
        </div>
    </nav>

    <main>
        <div class="task-container">
            <div class="task-header">
                <h1>Projects & Tasks</h1>
                <div class="task-stats" id="stats">0 tasks • 0 done</div>
            </div>

            <div class="input-group">
                <input type="text" id="task-input" placeholder="Add a new task or project..." autocomplete="off">
                <button class="add-btn" id="add-btn">Add</button>
            </div>

            <div class="task-list" id="tasks-list">
                </div>
        </div>
    </main>

    <script>
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const tasksList = document.getElementById('tasks-list');
        const statsEl = document.getElementById('stats');

        // Changed local storage key to match your app environment
        let tasks = JSON.parse(localStorage.getItem('syllaTasks')) || [];

        function saveTasks() {
            localStorage.setItem('syllaTasks', JSON.stringify(tasks));
            updateStats();
        }

        function updateStats() {
            const total = tasks.length;
            const done = tasks.filter(t => t.completed).length;
            statsEl.textContent = `${total} tasks • ${done} done`;
        }

        function renderTasks() {
            tasksList.innerHTML = '';

            if (tasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <p>No tasks remaining. You are all caught up.</p>
                    </div>
                `;
                return;
            }

            tasks.forEach((task, index) => {
                const taskEl = document.createElement('div');
                taskEl.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                taskEl.innerHTML = `
                    <div class="checkbox" data-index="${index}">${task.completed ? '&#10003;' : ''}</div>
                    <div class="task-text">${task.text}</div>
                    <button class="delete-btn" data-index="${index}">&times;</button>
                `;
                tasksList.appendChild(taskEl);
            });

            document.querySelectorAll('.checkbox').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    tasks[idx].completed = !tasks[idx].completed;
                    saveTasks();
                    renderTasks();
                });
            });

            document.querySelectorAll('.delete-btn').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    tasks.splice(idx, 1);
                    saveTasks();
                    renderTasks();
                });
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            tasks.unshift({
                text: text,
                completed: false,
                created: Date.now()
            });

            taskInput.value = '';
            saveTasks();
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Load on start
        renderTasks();
        updateStats();
    </script>
</body>
</html>
