<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Assistant</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#000;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar {
    width:240px;
    background:#111;
    padding:10px;
}

.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages {
    flex:1;
    padding:20px;
    overflow:auto;
}

.msg { margin:10px 0; }

.user { color:white; }
.ai { color:#aaa; }

.input {
    display:flex;
    padding:10px;
    background:#111;
}

input {
    flex:1;
    padding:10px;
}
</style>
</head>

<body>

<div class="sidebar">
<button onclick="newChat()">New Chat</button>
<div id="history"></div>
</div>

<div class="main">
<div id="messages" class="messages"></div>

<div class="input">
<input id="input">
<button onclick="send()">Send</button>
</div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || {};
let current = localStorage.getItem("current") || Date.now().toString();

if(!chats[current]) chats[current] = [];

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const history = document.getElementById("history");

function save(){
    localStorage.setItem("chats", JSON.stringify(chats));
    localStorage.setItem("current", current);
}

function add(text,cls){
    const div = document.createElement("div");
    div.className="msg "+cls;
    div.innerText=text;
    messages.appendChild(div);
}

function load(){
    messages.innerHTML="";
    (chats[current]||[]).forEach(m=>{
        add(m.content, m.role==="user"?"user":"ai");
    });
    renderHistory();
}

function renderHistory(){
    history.innerHTML="";

    Object.entries(chats)
    .sort((a,b)=>Number(b[0])-Number(a[0]))
    .forEach(([id,msgs])=>{
        const div=document.createElement("div");
        div.innerText=msgs[0]?.content||"New Chat";
        div.onclick=()=>{
            current=id;
            save();
            load();
        };
        history.appendChild(div);
    });
}

async function send(){
    const text=input.value.trim();
    if(!text) return;

    add(text,"user");
    chats[current].push({role:"user",content:text});
    input.value="";

    try {
        const res=await fetch("/api/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:text,history:chats[current]})
        });

        const data=await res.json();

        add(data.reply,"ai");
        chats[current].push({role:"assistant",content:data.reply});

        save();
        renderHistory();

    } catch {
        add("AI offline","ai");
    }
}

function newChat(){
    current=Date.now().toString();
    chats[current]=[];
    save();
    load();
}

load();
</script>

</body>
</html>
