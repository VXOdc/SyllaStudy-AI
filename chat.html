<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vxo AI • Study OS</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-blur: 40px;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --sidebar-width: 300px;
            --sidebar-collapsed-width: 80px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
                        url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
            background-size: cover; background-position: center;
            color: var(--text-primary); display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width); background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)); border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; transition: width 0.4s var(--transition);
            z-index: 100; flex-shrink: 0;
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

        .sidebar-header { padding: 24px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar.collapsed .sidebar-header { justify-content: center; }

        .icon-btn {
            background: transparent; border: none; color: var(--text-secondary);
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--glass-hover); color: var(--text-primary); }

        .new-chat-btn {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            margin: 0 20px 20px; background: #fff; color: #000;
            border: none; border-radius: 16px; font-weight: 600; cursor: pointer;
            transition: 0.3s; justify-content: center;
        }
        .new-chat-btn:hover { transform: scale(1.02); }
        .sidebar.collapsed .btn-text { display: none; }

        .history { flex: 1; overflow-y: auto; padding: 0 12px; }
        .chat-item {
            padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 4px;
            display: flex; align-items: center; gap: 12px; color: var(--text-secondary);
            transition: 0.2s; font-size: 14px;
        }
        .chat-item:hover, .chat-item.active { background: var(--glass-hover); color: #fff; }
        .sidebar.collapsed .chat-item-text { display: none; }

        /* Main Chat */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .messages-wrapper {
            flex: 1; overflow-y: auto; padding: 40px 20px;
            display: flex; justify-content: center;
        }
        .messages { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }

        .msg-row { display: flex; width: 100%; animation: fadeIn 0.3s ease; }
        .msg-row.user { justify-content: flex-end; }
        .msg {
            max-width: 80% ; padding: 14px 18px; border-radius: 20px;
            line-height: 1.6; font-size: 16px;
        }
        .msg.user { background: #fff; color: #000; border-bottom-right-radius: 4px; }
        .msg.ai { background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }

        /* Input Area */
        .input-wrapper { padding: 0 20px 30px; display: flex; justify-content: center; }
        .input-box {
            width: 100%; max-width: 800px; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 10px 16px; display: flex; align-items: flex-end; gap: 10px;
        }
        textarea {
            flex: 1; background: transparent; border: none; color: #fff;
            padding: 10px 0; resize: none; outline: none; font-size: 16px; max-height: 200px;
        }
        .send-btn {
            background: #fff; color: #000; width: 40px; height: 40px;
            border-radius: 50%; border: none; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <button class="icon-btn" onclick="toggleSidebar()"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-text">New Chat</span>
    </button>
    <div id="historyList" class="history"></div>
</nav>

<main class="main">
    <div class="messages-wrapper" id="scrollArea">
        <div id="messages" class="messages"></div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <textarea id="userInput" placeholder="Ask Vxo AI anything..." rows="1" oninput="autoHeight(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>
</main>

<script>
    let chats = JSON.parse(localStorage.getItem("vxo_chats")) || {};
    let activeId = localStorage.getItem("vxo_active") || Date.now().toString();
    
    const msgContainer = document.getElementById("messages");
    const input = document.getElementById("userInput");
    const historyList = document.getElementById("historyList");

    if (!chats[activeId]) chats[activeId] = [];

    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }

    function autoHeight(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function save() {
        localStorage.setItem("vxo_chats", JSON.stringify(chats));
        localStorage.setItem("vxo_active", activeId);
        renderHistory();
    }

    function renderHistory() {
        historyList.innerHTML = "";
        Object.keys(chats).sort((a,b) => b-a).forEach(id => {
            const firstMsg = chats[id][0]?.content || "Empty Chat";
            const item = document.createElement("div");
            item.className = `chat-item ${id === activeId ? 'active' : ''}`;
            item.innerHTML = `<div class="chat-item-text">${firstMsg.substring(0, 30)}...</div>`;
            item.onclick = () => { activeId = id; loadChat(); };
            historyList.appendChild(item);
        });
    }

    function loadChat() {
        msgContainer.innerHTML = chats[activeId].length ? "" : `<div style="text-align:center; margin-top:100px; opacity:0.5"><h1>Vxo Study AI</h1><p>Mistral Large 3 Powered</p></div>`;
        chats[activeId].forEach(m => appendUI(m.content, m.role));
        renderHistory();
    }

    function appendUI(text, role) {
        const row = document.createElement("div");
        row.className = `msg-row ${role}`;
        // Simple Markdown-ish formatting
        const formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        row.innerHTML = `<div class="msg ${role}">${formatted}</div>`;
        msgContainer.appendChild(row);
        document.getElementById("scrollArea").scrollTop = document.getElementById("scrollArea").scrollHeight;
    }

    async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        input.style.height = "auto";
        
        chats[activeId].push({ role: "user", content: text });
        appendUI(text, "user");
        save();

        const typing = document.createElement("div");
        typing.className = "msg-row ai";
        typing.innerHTML = `<div class="msg ai">...</div>`;
        msgContainer.appendChild(typing);

        try {
            const res = await fetch("https://vxo-dc-github-e3bqc1p11-vxodcs-projects.vercel.app/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: text, 
                    history: chats[activeId].slice(0, -1) 
                })
            });

            const data = await res.json();
            typing.remove();
            
            const reply = data.reply || "Connection Error.";
            chats[activeId].push({ role: "ai", content: reply });
            appendUI(reply, "ai");
            save();

        } catch (err) {
            typing.innerHTML = `<div class="msg ai" style="color:#ff453a">Error: Backend unreachable.</div>`;
        }
    }

    function newChat() {
        activeId = Date.now().toString();
        chats[activeId] = [];
        loadChat();
    }

    input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } });

    loadChat();
</script>

</body>
</html>
