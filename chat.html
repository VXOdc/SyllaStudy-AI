<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-hover: rgba(255, 255, 255, 0.15);
        --glass-active: rgba(255, 255, 255, 0.22);
        --glass-border: rgba(255, 255, 255, 0.18);
        --glass-blur: 40px;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
        --sidebar-width: 320px;
        --sidebar-collapsed-width: 80px;
        --transition-spring: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)),
                    url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
        width: var(--sidebar-width);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        transition: width 0.4s var(--transition-spring);
        z-index: 100;
        flex-shrink: 0;
    }

    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .sidebar.collapsed .chat-item-text, 
    .sidebar.collapsed .history-label,
    .sidebar.collapsed .chat-actions { display: none; }

    .sidebar-header { padding: 24px 20px; display: flex; align-items: center; justify-content: space-between; }

    .icon-btn {
        background: transparent; border: none; color: var(--text-secondary);
        width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--glass-hover); color: #fff; }

    .new-chat-btn {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        padding: 12px 16px; margin: 0 20px 20px;
        background: #fff; color: #000; border: none; border-radius: 16px;
        font-weight: 600; cursor: pointer; transition: 0.3s;
    }

    .history { flex: 1; overflow-y: auto; padding: 0 12px; }
    .history-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 10px 12px; text-transform: uppercase; }

    /* CHAT ITEM & ACTIONS */
    .chat-item {
        padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 4px;
        color: var(--text-secondary); display: flex; align-items: center; gap: 10px;
        transition: 0.2s; position: relative; overflow: hidden;
    }
    .chat-item:hover, .chat-item.active { background: var(--glass-hover); color: #fff; }
    .chat-item-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }

    .chat-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
    .chat-item:hover .chat-actions { opacity: 1; }

    .action-sub-btn {
        background: transparent; border: none; color: var(--text-secondary);
        padding: 4px; cursor: pointer; border-radius: 4px;
    }
    .action-sub-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .action-sub-btn.del:hover { color: #ff453a; }

    /* MAIN CONTENT */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; }
    .messages-wrapper { flex: 1; overflow-y: auto; padding: 80px 20px 40px; display: flex; justify-content: center; }
    .messages { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }

    /* EMPTY STATE */
    .empty-state { text-align: center; margin-top: 15vh; opacity: 0.8; }
    .empty-state h1 { font-size: 42px; margin-bottom: 10px; }

    /* BUBBLES */
    .msg-row { display: flex; width: 100%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg { max-width: 75%; padding: 16px 20px; border-radius: 20px; line-height: 1.5; font-size: 16px; }
    .msg.user { background: #fff; color: #000; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .msg.ai { background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }

    /* INPUT */
    .input-wrapper { padding: 0 20px 40px; display: flex; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.4)); }
    .input-box {
        width: 100%; max-width: 800px; background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(40px); border: 1px solid var(--glass-border);
        border-radius: 32px; padding: 12px;
    }
    .input-row { display: flex; align-items: center; gap: 12px; }
    textarea {
        flex: 1; background: transparent; border: none; color: white;
        font-size: 16px; outline: none; resize: none; padding: 8px; max-height: 150px;
    }

    .send-btn {
        width: 44px; height: 44px; border-radius: 50%; background: #fff;
        border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:disabled { opacity: 0.3; }

    .typing-indicator { display: flex; gap: 5px; padding: 10px; }
    .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1.4s infinite; opacity: 0.4; }
    @keyframes blink { 50% { opacity: 1; } }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <button class="icon-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>New Chat</span>
    </button>
    <div class="history-label">Recent Chats</div>
    <div id="historyList" class="history"></div>
</nav>

<main class="main">
    <div class="messages-wrapper" id="messagesWrapper">
        <div id="messages" class="messages"></div>
    </div>
    
    <div class="input-wrapper">
        <div class="input-box">
            <div class="input-row">
                <textarea id="input" placeholder="Ask anything about your studies..." rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send();}"></textarea>
                <button class="send-btn" id="sendBtn" onclick="send()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </div>
</main>

<script>
let chats = JSON.parse(localStorage.getItem("vxoChats")) || {};
let currentChat = localStorage.getItem("vxoCurrentChat") || "default";

if (!chats[currentChat]) chats[currentChat] = [];

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");

function save() {
    localStorage.setItem("vxoChats", JSON.stringify(chats));
    localStorage.setItem("vxoCurrentChat", currentChat);
}

function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }

function newChat() {
    currentChat = Date.now().toString();
    chats[currentChat] = [];
    save();
    renderMessages();
    renderHistory();
}

function renderMessages() {
    messagesEl.innerHTML = "";
    const msgs = chats[currentChat] || [];
    if(msgs.length === 0) {
        messagesEl.innerHTML = `
            <div class="empty-state">
                <h1>What do you want to learn?</h1>
                <p>Type a prompt below to get started.</p>
            </div>`;
    } else {
        msgs.forEach(m => appendMessageHTML(m.content, m.role));
    }
    document.getElementById("messagesWrapper").scrollTop = document.getElementById("messagesWrapper").scrollHeight;
}

function appendMessageHTML(text, role) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    row.innerHTML = `<div class="msg ${role}">${text.replace(/\n/g, '<br>')}</div>`;
    messagesEl.appendChild(row);
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    appendMessageHTML(text, "user");
    chats[currentChat].push({ role: "user", content: text });
    input.value = "";
    input.style.height = 'auto';
    
    const typingRow = document.createElement("div");
    typingRow.className = "msg-row ai";
    typingRow.innerHTML = `<div class="msg ai typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(typingRow);
    document.getElementById("messagesWrapper").scrollTop = document.getElementById("messagesWrapper").scrollHeight;

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history: chats[currentChat].slice(0, -1) })
        });
        const data = await res.json();
        typingRow.remove();
        if (data.reply) {
            appendMessageHTML(data.reply, "ai");
            chats[currentChat].push({ role: "ai", content: data.reply });
        }
    } catch (e) {
        typingRow.remove();
        appendMessageHTML("Error connecting to AI.", "ai");
    }
    save();
    renderHistory();
}

function renderHistory() {
    const hist = document.getElementById("historyList");
    hist.innerHTML = "";
    Object.keys(chats).sort((a,b) => b-a).forEach(id => {
        const item = document.createElement("div");
        item.className = `chat-item ${id === currentChat ? 'active' : ''}`;
        
        const name = chats[id].name || (chats[id][0]?.content.substring(0, 20) || "New Chat") + "...";
        
        item.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="chat-item-text" onclick="switchChat('${id}')">${name}</span>
            <div class="chat-actions">
                <button class="action-sub-btn" onclick="renameChat('${id}')" title="Rename">✎</button>
                <button class="action-sub-btn del" onclick="deleteChat('${id}')" title="Delete">✕</button>
            </div>
        `;
        hist.appendChild(item);
    });
}

function switchChat(id) {
    currentChat = id;
    save();
    renderMessages();
    renderHistory();
}

function renameChat(id) {
    const newName = prompt("Enter new name for this chat:");
    if (newName) {
        chats[id].name = newName;
        save();
        renderHistory();
    }
}

function deleteChat(id) {
    if (confirm("Delete this chat?")) {
        delete chats[id];
        if (currentChat === id) currentChat = Object.keys(chats)[0] || "default";
        if (!chats[currentChat]) chats[currentChat] = [];
        save();
        renderMessages();
        renderHistory();
    }
}

renderHistory();
renderMessages();
</script>
</body>
</html>
