<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
:root {
    --glass: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.25);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(rgba(0,0,0,0.48), rgba(0,0,0,0.82)),
                url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 300px;
    background: var(--glass);
    backdrop-filter: blur(32px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.back-btn, .newChat {
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
}

.back-btn { background: rgba(255,255,255,0.18); color: white; }
.newChat { background: rgba(255,255,255,0.95); color: black; }

/* History */
.history { flex: 1; overflow-y: auto; }

.chat-item {
    padding: 14px 16px;
    border-radius: 14px;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 14.5px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-item:hover { background: rgba(255,255,255,0.20); }
.chat-item.active { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); }

/* Main Chat */
.main { flex: 1; display: flex; flex-direction: column; }

.messages {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
}

.msg {
    margin: 14px 0;
    max-width: 74%;
    padding: 16px 20px;
    border-radius: 22px;
    line-height: 1.5;
}

.user { background: rgba(255,255,255,0.94); color: #000; margin-left: auto; }
.ai { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); }

/* Attachment Preview */
.attachments {
    display: flex;
    gap: 8px;
    padding: 8px 24px;
    background: rgba(0,0,0,0.4);
    overflow-x: auto;
}

.attachment-preview {
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.attachment-preview button {
    background: none;
    border: none;
    color: #ff3b30;
    cursor: pointer;
    font-size: 16px;
}

/* Input Bar */
.inputBar {
    padding: 16px 24px;
    background: rgba(0,0,0,0.68);
    backdrop-filter: blur(28px);
    display: flex;
    align-items: center;
    gap: 12px;
}

input {
    flex: 1;
    padding: 16px 22px;
    border: none;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    border-radius: 9999px;
    font-size: 16.5px;
    outline: none;
}

.attachment-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

button.send {
    padding: 14px 28px;
    border-radius: 9999px;
    border: none;
    background: white;
    color: black;
    cursor: pointer;
    font-weight: 700;
}
</style>
</head>
<body>

<div class="sidebar">
    <a href="index.html" class="back-btn">← Home</a>
    <button class="newChat" onclick="newChat()">+ New Chat</button>
    <div id="historyList" class="history"></div>
</div>

<div class="main">
    <div id="messages" class="messages"></div>
    
    <!-- Attachment Previews -->
    <div id="attachmentBar" class="attachments" style="display:none;"></div>

    <div class="inputBar">
        <button class="attachment-btn" onclick="triggerFileUpload()">📎</button>
        <input id="input" placeholder="Ask anything about your studies..." autocomplete="off">
        <button class="send" onclick="send()">Send</button>
    </div>
</div>

<input type="file" id="fileInput" multiple style="display:none;" onchange="handleFiles(this.files)">

<script>
// ... (keeping all your existing chat logic - newChat, loadChat, send, etc.)
// I'll only show the new attachment parts here for brevity

let currentAttachments = [];

function triggerFileUpload() {
    document.getElementById("fileInput").click();
}

function handleFiles(files) {
    Array.from(files).forEach(file => {
        currentAttachments.push(file);
        renderAttachments();
    });
}

function renderAttachments() {
    const bar = document.getElementById("attachmentBar");
    bar.innerHTML = "";
    if (currentAttachments.length === 0) {
        bar.style.display = "none";
        return;
    }
    bar.style.display = "flex";

    currentAttachments.forEach((file, index) => {
        const div = document.createElement("div");
        div.className = "attachment-preview";
        div.innerHTML = `
            📎 ${file.name}
            <button onclick="removeAttachment(${index}); event.stopImmediatePropagation();">×</button>
        `;
        bar.appendChild(div);
    });
}

function removeAttachment(index) {
    currentAttachments.splice(index, 1);
    renderAttachments();
}

// Updated send function
async function send() {
    const text = input.value.trim();
    let messageText = text;

    // Add attachment info to the message
    if (currentAttachments.length > 0) {
        const attachmentNames = currentAttachments.map(f => f.name).join(", ");
        messageText += `\n\n[📎 Attached files: ${attachmentNames}]`;
    }

    if (!messageText) return;

    addMessage(messageText, "user");
    chats[currentChat].push({ role: "user", content: messageText });

    input.value = "";
    currentAttachments = [];           // clear attachments after send
    renderAttachments();

    // ... rest of your existing send logic (typing indicator, API call, etc.)
    const typing = document.createElement("div");
    typing.className = "msg ai";
    typing.innerText = "Thinking...";
    messagesEl.appendChild(typing);

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: messageText, history: chats[currentChat] })
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        messagesEl.removeChild(typing);
        addMessage(data.reply || "Sorry, I couldn't process that.", "ai");
        chats[currentChat].push({ role: "assistant", content: data.reply });
    } catch (e) {
        if (typing.parentNode) messagesEl.removeChild(typing);
        addMessage("Error: AI service unavailable right now.", "ai");
    }

    save();
    renderHistory();
}

// Keep all your existing functions (newChat, loadChat, renderHistory, etc.)
// ... (the rest of your script stays the same)
</script>
</body>
</html>
