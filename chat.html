<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
:root {
    --glass: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.25);
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(rgba(0,0,0,0.48), rgba(0,0,0,0.82)),
                url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
    overflow: hidden;
}
/* Sidebar */
.sidebar {
    width: 300px;
    background: var(--glass);
    backdrop-filter: blur(32px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
}
.back-btn, .newChat {
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
}
.back-btn { background: rgba(255,255,255,0.18); color: white; }
.newChat { background: rgba(255,255,255,0.95); color: black; }
/* History */
.history { flex: 1; overflow-y: auto; }
.chat-item {
    padding: 14px 16px;
    border-radius: 14px;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 14.5px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s ease;
}
.chat-item:hover { background: rgba(255,255,255,0.20); }
.chat-item.active { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); }
.menu-btn { opacity: 0.6; cursor: pointer; padding: 4px; }
.menu-btn:hover { opacity: 1; }
/* Context Menu */
.context-menu {
    position: absolute;
    background: rgba(30,30,30,0.95);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 8px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 2000;
    min-width: 160px;
    display: none;
}
.context-menu div {
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}
.context-menu div:hover { background: rgba(255,255,255,0.15); }
.context-menu .delete { color: #ff3b30; }
/* Main Area */
.main { flex: 1; display: flex; flex-direction: column; }
.messages {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
}
.msg {
    margin: 14px 0;
    max-width: 74%;
    padding: 16px 20px;
    border-radius: 22px;
    line-height: 1.5;
}
.user { background: rgba(255,255,255,0.94); color: #000; margin-left: auto; }
.ai { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); }
/* Attachment Bar */
.attachments {
    display: flex;
    gap: 8px;
    padding: 8px 24px;
    background: rgba(0,0,0,0.4);
    overflow-x: auto;
}
.attachment-preview {
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}
.attachment-preview button {
    background: none;
    border: none;
    color: #ff3b30;
    cursor: pointer;
    font-size: 16px;
}
/* Input Bar */
.inputBar {
    padding: 18px 24px;
    background: rgba(0,0,0,0.68);
    backdrop-filter: blur(28px);
    display: flex;
    align-items: center;
    gap: 12px;
}
input {
    flex: 1;
    padding: 16px 24px;
    border: none;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    border-radius: 9999px;
    font-size: 16.5px;
    outline: none;
}
.attachment-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
button.send {
    padding: 14px 28px;
    border-radius: 9999px;
    border: none;
    background: white;
    color: black;
    cursor: pointer;
    font-weight: 700;
}
</style>
</head>
<body>
<div class="sidebar">
    <a href="index.html" class="back-btn">← Home</a>
    <button class="newChat" onclick="newChat()">+ New Chat</button>
    <div id="historyList" class="history"></div>
</div>
<div class="main">
    <div id="messages" class="messages"></div>
    
    <!-- Attachment Previews -->
    <div id="attachmentBar" class="attachments" style="display:none;"></div>
    <div class="inputBar">
        <button class="attachment-btn" onclick="triggerFileUpload()">📎</button>
        <input id="input" placeholder="Ask anything about your studies..." autocomplete="off">
        <button class="send" onclick="send()">Send</button>
    </div>
</div>
<!-- Context Menu -->
<div id="contextMenu" class="context-menu">
    <div onclick="renameChat()">Rename</div>
    <div onclick="archiveChat()">Archive</div>
    <div onclick="pinChat()">Pin</div>
    <div class="delete" onclick="deleteChat()">Delete</div>
</div>
<input type="file" id="fileInput" multiple style="display:none;" onchange="handleFiles(this.files)">
<script>
let chats = JSON.parse(localStorage.getItem("chats")) || {};
let currentChat = localStorage.getItem("currentChat") || Date.now().toString();
if (!chats[currentChat]) chats[currentChat] = [];
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const historyList = document.getElementById("historyList");
let contextMenu = document.getElementById("contextMenu");
let currentContextId = null;
let currentAttachments = [];
function save() {
    localStorage.setItem("chats", JSON.stringify(chats));
    localStorage.setItem("currentChat", currentChat);
}
function newChat() {
    currentChat = Date.now().toString();
    chats[currentChat] = [];
    save();
    loadChat();
}
function loadChat() {
    messagesEl.innerHTML = "";
    (chats[currentChat] || []).forEach(msg => {
        addMessage(msg.content, msg.role === "user" ? "user" : "ai");
    });
    renderHistory();
}
function renderHistory() {
    historyList.innerHTML = "";
    const sorted = Object.entries(chats).sort((a,b) => Number(b[0]) - Number(a[0]));
    sorted.slice(0, 20).forEach(([id, msgs]) => {
        const div = document.createElement("div");
        div.className = `chat-item ${id === currentChat ? 'active' : ''}`;
        const preview = msgs.find(m => m.role === "user")?.content || "New Chat";
        div.innerHTML = `
            <span>${preview.slice(0, 38)}${preview.length > 38 ? '...' : ''}</span>
            <span class="menu-btn" onclick="showContextMenu(event, '${id}')">⋯</span>
        `;
        div.onclick = (e) => {
            if (!e.target.classList.contains('menu-btn')) {
                currentChat = id;
                save();
                loadChat();
            }
        };
        historyList.appendChild(div);
    });
}
function showContextMenu(e, id) {
    e.stopImmediatePropagation();
    currentContextId = id;
    contextMenu.style.display = 'block';
    contextMenu.style.left = `${e.pageX + 10}px`;
    contextMenu.style.top = `${e.pageY + 10}px`;
}
function hideContextMenu() {
    contextMenu.style.display = 'none';
}
document.addEventListener('click', hideContextMenu);
function deleteChat() {
    if (confirm("Delete this chat?")) {
        delete chats[currentContextId];
        if (currentChat === currentContextId) {
            currentChat = Object.keys(chats)[0] || Date.now().toString();
            if (!chats[currentChat]) chats[currentChat] = [];
        }
        save();
        loadChat();
    }
    hideContextMenu();
}
function renameChat() {
    const newName = prompt("Rename chat:", "New Chat Name");
    if (newName && newName.trim()) {
        if (chats[currentContextId] && chats[currentContextId].length > 0) {
            chats[currentContextId][0].content = newName.trim();
        }
        save();
        loadChat();
    }
    hideContextMenu();
}
function archiveChat() { alert("Archive feature coming soon"); hideContextMenu(); }
function pinChat() { alert("Pin feature coming soon"); hideContextMenu(); }
// ====================== ATTACHMENT FEATURES ======================
function triggerFileUpload() {
    document.getElementById("fileInput").click();
}
function handleFiles(files) {
    Array.from(files).forEach(file => {
        currentAttachments.push(file);
    });
    renderAttachments();
}
function renderAttachments() {
    const bar = document.getElementById("attachmentBar");
    bar.innerHTML = "";
    if (currentAttachments.length === 0) {
        bar.style.display = "none";
        return;
    }
    bar.style.display = "flex";
    currentAttachments.forEach((file, index) => {
        const div = document.createElement("div");
        div.className = "attachment-preview";
        div.innerHTML = `📎 ${file.name} <button onclick="removeAttachment(${index}); event.stopImmediatePropagation();">×</button>`;
        bar.appendChild(div);
    });
}
function removeAttachment(index) {
    currentAttachments.splice(index, 1);
    renderAttachments();
}
// ====================== SEND FUNCTION ======================
async function send() {
    const text = input.value.trim();
    let messageText = text;
    if (currentAttachments.length > 0) {
        const names = currentAttachments.map(f => f.name).join(", ");
        messageText += `\n\n[📎 Attached: ${names}]`;
    }
    if (!messageText) return;
    addMessage(messageText, "user");
    chats[currentChat].push({ role: "user", content: messageText });
    input.value = "";
    currentAttachments = [];
    renderAttachments();
    const typing = document.createElement("div");
    typing.className = "msg ai";
    typing.innerText = "Thinking...";
    messagesEl.appendChild(typing);
    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: messageText, history: chats[currentChat] })
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        messagesEl.removeChild(typing);
        addMessage(data.reply || "Sorry, I couldn't process that.", "ai");
        chats[currentChat].push({ role: "assistant", content: data.reply });
    } catch (e) {
        if (typing.parentNode) messagesEl.removeChild(typing);
        addMessage("Error: AI service unavailable right now.", "ai");
    }
    save();
    renderHistory();
}
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerText = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
loadChat();
</script>
</body>
</html>
