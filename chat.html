<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
    /* ==========================================================================
       CSS VARIABLES & THEME (Keeping your exact UI)
       ========================================================================== */
    :root {
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-hover: rgba(255, 255, 255, 0.15);
        --glass-active: rgba(255, 255, 255, 0.22);
        --glass-border: rgba(255, 255, 255, 0.18);
        --glass-blur: 40px;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
        --sidebar-width: 320px;
        --sidebar-collapsed-width: 80px;
        --transition-spring: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)),
                    url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
        width: var(--sidebar-width);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        transition: width 0.4s var(--transition-spring);
        z-index: 100;
        flex-shrink: 0;
    }

    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

    .new-chat-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px 16px;
        margin: 20px;
        background: #ffffff;
        color: #000;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .history { flex: 1; overflow-y: auto; padding: 0 12px; }
    .chat-item {
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
    }
    .chat-item:hover, .chat-item.active { background: var(--glass-hover); color: #fff; }

    /* MAIN CONTENT */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .messages-wrapper {
        flex: 1;
        overflow-y: auto;
        padding: 80px 20px;
        display: flex;
        justify-content: center;
    }

    .messages { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }

    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg {
        max-width: 75%;
        padding: 16px 20px;
        border-radius: 20px;
        line-height: 1.5;
    }

    .msg.user { background: #fff; color: #000; border-bottom-right-radius: 4px; }
    .msg.ai { background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }

    /* INPUT AREA */
    .input-wrapper { padding: 0 20px 40px; display: flex; justify-content: center; }
    .input-box {
        width: 100%;
        max-width: 800px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        padding: 12px;
    }

    .input-row { display: flex; align-items: center; gap: 12px; }
    textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        font-size: 16px;
        outline: none;
        resize: none;
        padding: 8px;
    }

    .send-btn {
        width: 44px; height: 44px;
        border-radius: 50%;
        background: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .typing-indicator { display: flex; gap: 5px; padding: 10px; }
    .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1.4s infinite; opacity: 0.4; }
    @keyframes blink { 50% { opacity: 1; } }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
    <div style="padding: 20px;">
        <button class="icon-btn" onclick="toggleSidebar()" style="background:none; border:none; color:white; cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    <div id="historyList" class="history"></div>
</nav>

<main class="main">
    <div class="messages-wrapper" id="messagesWrapper">
        <div id="messages" class="messages">
            <div class="msg-row ai">
                <div class="msg ai">Hello! How can I help you with your studies today?</div>
            </div>
        </div>
    </div>
    
    <div class="input-wrapper">
        <div class="input-box">
            <div class="input-row">
                <textarea id="input" placeholder="Ask anything about your studies..." rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send();}"></textarea>
                <button class="send-btn" id="sendBtn" onclick="send()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </div>
</main>

<script>
let chats = JSON.parse(localStorage.getItem("vxoChats")) || { "default": [] };
let currentChat = localStorage.getItem("vxoCurrentChat") || "default";

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");

function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }

function newChat() {
    currentChat = Date.now().toString();
    chats[currentChat] = [];
    renderMessages();
    renderHistory();
}

function renderMessages() {
    messagesEl.innerHTML = "";
    const msgs = chats[currentChat] || [];
    if(msgs.length === 0) {
        messagesEl.innerHTML = '<div class="msg-row ai"><div class="msg ai">New conversation started. What is on your mind?</div></div>';
    }
    msgs.forEach(m => appendMessageHTML(m.content, m.role));
}

function appendMessageHTML(text, role) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    row.innerHTML = `<div class="msg ${role}">${text.replace(/\n/g, '<br>')}</div>`;
    messagesEl.appendChild(row);
    document.getElementById("messagesWrapper").scrollTop = document.getElementById("messagesWrapper").scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    appendMessageHTML(text, "user");
    chats[currentChat].push({ role: "user", content: text });
    input.value = "";
    
    // Typing indicator
    const typingRow = document.createElement("div");
    typingRow.className = "msg-row ai";
    typingRow.innerHTML = `<div class="msg ai typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(typingRow);

    try {
        // FIXED: Using relative path to talk to your chat.js
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                history: chats[currentChat].slice(0, -1)
            })
        });

        const data = await res.json();
        typingRow.remove();

        if (data.reply) {
            appendMessageHTML(data.reply, "ai");
            chats[currentChat].push({ role: "ai", content: data.reply });
        } else {
            appendMessageHTML("Error: " + (data.error || "Unknown error"), "ai");
        }
    } catch (e) {
        typingRow.remove();
        appendMessageHTML("Connection Error. Check if your Vercel deployment is finished.", "ai");
    }
    
    localStorage.setItem("vxoChats", JSON.stringify(chats));
    localStorage.setItem("vxoCurrentChat", currentChat);
    renderHistory();
}

function renderHistory() {
    const hist = document.getElementById("historyList");
    hist.innerHTML = "";
    Object.keys(chats).reverse().forEach(id => {
        const item = document.createElement("div");
        item.className = `chat-item ${id === currentChat ? 'active' : ''}`;
        const firstMsg = chats[id][0]?.content || "New Chat";
        item.innerText = firstMsg.substring(0, 20) + "...";
        item.onclick = () => { currentChat = id; renderMessages(); renderHistory(); };
        hist.appendChild(item);
    });
}

renderHistory();
renderMessages();
</script>
</body>
</html>
