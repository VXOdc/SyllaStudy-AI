<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-hover: rgba(255, 255, 255, 0.15);
        --glass-active: rgba(255, 255, 255, 0.22);
        --glass-border: rgba(255, 255, 255, 0.18);
        --glass-blur: 40px;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
        --sidebar-width: 320px;
        --sidebar-collapsed-width: 80px;
        --transition-spring: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)),
                    url("https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
        width: var(--sidebar-width);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        transition: width 0.4s var(--transition-spring);
        z-index: 100;
        flex-shrink: 0;
    }

    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

    .new-chat-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px 16px;
        margin: 20px;
        background: #ffffff;
        color: #000;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .history { flex: 1; overflow-y: auto; padding: 0 12px; }
    
    .chat-item {
        position: relative;
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
        transition: 0.2s;
    }
    .chat-item:hover, .chat-item.active { background: var(--glass-hover); color: #fff; }
    .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    
    .chat-actions-trigger {
        opacity: 0;
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
    }
    .chat-item:hover .chat-actions-trigger { opacity: 1; }
    .chat-actions-trigger:hover { background: var(--glass-active); }

    /* CONTEXT MENU */
    .context-menu {
        position: fixed;
        background: rgba(30, 30, 30, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 6px;
        display: none;
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .context-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        background: none;
        border: none;
        color: white;
        font-size: 13px;
        cursor: pointer;
        border-radius: 6px;
    }
    .context-menu button:hover { background: var(--glass-hover); }
    .context-menu .delete { color: #ff4d4d; }

    /* NOTIFICATIONS */
    #notification-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .toast {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        color: white;
        padding: 12px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* MAIN CONTENT */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; }
    .messages-wrapper { flex: 1; overflow-y: auto; padding: 80px 20px; display: flex; justify-content: center; scroll-behavior: smooth;}
    .messages { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }
    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }
    .msg { max-width: 75%; padding: 16px 20px; border-radius: 20px; line-height: 1.5; font-size: 15px;}
    .msg.user { background: #fff; color: #000; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
    .msg.ai { background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }

    /* INPUT AREA */
    .input-wrapper { padding: 0 20px 40px; display: flex; justify-content: center; }
    .input-box {
        width: 100%;
        max-width: 800px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 14px;
        transition: 0.3s;
    }
    .input-box:focus-within { border-color: rgba(255,255,255,0.4); background: rgba(0,0,0,0.5); }
    .input-row { display: flex; align-items: flex-end; gap: 12px; }
    textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        font-size: 16px;
        outline: none;
        resize: none;
        padding: 4px 8px;
        max-height: 200px;
    }
    .send-btn {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.3; }

    .pin-icon { font-size: 10px; margin-right: 6px; transform: rotate(45deg); display: inline-block; }
</style>
</head>
<body>

<div id="notification-container"></div>

<div id="contextMenu" class="context-menu">
    <button onclick="handleRename()">Rename</button>
    <button onclick="handlePin()">Toggle Pin</button>
    <button class="delete" onclick="handleDelete()">Delete</button>
</div>

<nav class="sidebar" id="sidebar">
    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <button onclick="toggleSidebar()" style="background:none; border:none; color:white; cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <span style="font-weight: 600; font-size: 14px; letter-spacing: 1px;">HISTORY</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    <div id="historyList" class="history"></div>
</nav>

<main class="main">
    <div class="messages-wrapper" id="messagesWrapper">
        <div id="messages" class="messages"></div>
    </div>
    
    <div class="input-wrapper">
        <div class="input-box">
            <div class="input-row">
                <textarea id="input" placeholder="Ask Vxo anything..." rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send();}"></textarea>
                <button class="send-btn" id="sendBtn" onclick="send()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </div>
</main>

<script>
// --- State Management ---
let chats = JSON.parse(localStorage.getItem("vxoChats")) || {};
let pinnedChats = JSON.parse(localStorage.getItem("vxoPinned")) || [];
let customNames = JSON.parse(localStorage.getItem("vxoNames")) || {};
let currentChat = localStorage.getItem("vxoCurrentChat") || "default";
let menuTargetId = null;

// Initialize if empty
if (Object.keys(chats).length === 0) chats["default"] = [];

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const menu = document.getElementById("contextMenu");

// --- UI Helpers ---
function notify(text) {
    const container = document.getElementById("notification-container");
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = text;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
}

function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }

// --- Chat Actions ---
function newChat() {
    currentChat = "chat_" + Date.now();
    chats[currentChat] = [];
    save();
    renderMessages();
    renderHistory();
    notify("New chat created");
}

function save() {
    localStorage.setItem("vxoChats", JSON.stringify(chats));
    localStorage.setItem("vxoCurrentChat", currentChat);
    localStorage.setItem("vxoPinned", JSON.stringify(pinnedChats));
    localStorage.setItem("vxoNames", JSON.stringify(customNames));
}

function renderMessages() {
    messagesEl.innerHTML = "";
    const msgs = chats[currentChat] || [];
    if(msgs.length === 0) {
        appendMessageHTML("Hello! I'm your Vxo Study Assistant. What are we working on?", "ai");
    }
    msgs.forEach(m => appendMessageHTML(m.content, m.role));
}

function appendMessageHTML(text, role) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;
    row.innerHTML = `<div class="msg ${role}">${text.replace(/\n/g, '<br>')}</div>`;
    messagesEl.appendChild(row);
    const wrap = document.getElementById("messagesWrapper");
    wrap.scrollTop = wrap.scrollHeight;
}

// --- Sidebar & Context Menu Logic ---
function showMenu(e, id) {
    e.preventDefault();
    e.stopPropagation();
    menuTargetId = id;
    menu.style.display = "block";
    menu.style.left = e.pageX + "px";
    menu.style.top = e.pageY + "px";
}

document.addEventListener('click', () => menu.style.display = "none");

function handleRename() {
    const newName = prompt("Enter new chat name:");
    if (newName) {
        customNames[menuTargetId] = newName;
        save();
        renderHistory();
        notify("Chat renamed");
    }
}

function handlePin() {
    const index = pinnedChats.indexOf(menuTargetId);
    if (index > -1) pinnedChats.splice(index, 1);
    else pinnedChats.push(menuTargetId);
    save();
    renderHistory();
    notify(index > -1 ? "Unpinned" : "Pinned to top");
}

function handleDelete() {
    if (Object.keys(chats).length <= 1) return notify("Can't delete last chat");
    if (confirm("Delete this conversation?")) {
        delete chats[menuTargetId];
        pinnedChats = pinnedChats.filter(id => id !== menuTargetId);
        if (currentChat === menuTargetId) currentChat = Object.keys(chats)[0];
        save();
        renderHistory();
        renderMessages();
        notify("Chat deleted");
    }
}

function renderHistory() {
    const hist = document.getElementById("historyList");
    hist.innerHTML = "";
    
    // Sort: Pinned first, then by timestamp
    const sortedIds = Object.keys(chats).sort((a, b) => {
        const aPinned = pinnedChats.includes(a);
        const bPinned = pinnedChats.includes(b);
        if (aPinned && !bPinned) return -1;
        if (!aPinned && bPinned) return 1;
        return b - a;
    });

    sortedIds.forEach(id => {
        const item = document.createElement("div");
        item.className = `chat-item ${id === currentChat ? 'active' : ''}`;
        
        const isPinned = pinnedChats.includes(id);
        const name = customNames[id] || chats[id][0]?.content.substring(0, 25) || "Empty Chat";
        
        item.innerHTML = `
            <div class="title" onclick="switchChat('${id}')">
                ${isPinned ? '<span class="pin-icon">📌</span>' : ''} ${name}
            </div>
            <button class="chat-actions-trigger" onclick="showMenu(event, '${id}')">⋮</button>
        `;
        hist.appendChild(item);
    });
}

function switchChat(id) {
    currentChat = id;
    save();
    renderMessages();
    renderHistory();
}

// --- The Core API Logic ---
async function send() {
    const text = input.value.trim();
    if (!text) return;

    appendMessageHTML(text, "user");
    chats[currentChat].push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";
    
    const typingRow = document.createElement("div");
    typingRow.className = "msg-row ai";
    typingRow.innerHTML = `<div class="msg ai typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(typingRow);
    
    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                history: chats[currentChat].slice(0, -1)
            })
        });

        const data = await res.json();
        typingRow.remove();

        if (data.reply) {
            appendMessageHTML(data.reply, "ai");
            chats[currentChat].push({ role: "ai", content: data.reply });
        } else {
            notify("API Error: Check your key");
        }
    } catch (e) {
        typingRow.remove();
        notify("Connection lost. Try again.");
    }
    save();
    renderHistory();
}

// Initial Load
renderHistory();
renderMessages();
</script>
</body>
</html>
