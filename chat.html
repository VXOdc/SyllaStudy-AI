<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant • Vxo Study OS</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.8)), 
                url("https://images.unsplash.com/photo-1501785888041-af3ef285b470");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 260px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
}

.newChat {
    margin: 12px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: white;
    color: black;
    font-weight: 600;
    cursor: pointer;
}

.history {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.chat-item {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
}

.chat-item:hover { background: rgba(255,255,255,0.15); }

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.msg {
    margin: 12px 0;
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 14px;
}

.user {
    background: rgba(255,255,255,0.9);
    color: black;
    margin-left: auto;
}

.ai {
    background: rgba(255,255,255,0.15);
}

.inputBar {
    padding: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    display: flex;
}

input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
    border-radius: 999px;
    outline: none;
}

button.send {
    margin-left: 10px;
    padding: 12px 20px;
    border-radius: 999px;
    border: none;
    background: white;
    color: black;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="sidebar">
    <button class="newChat" onclick="newChat()">+ New Chat</button>
    <div id="historyList" class="history"></div>
</div>

<div class="main">
    <div id="messages" class="messages"></div>
    <div class="inputBar">
        <input id="input" placeholder="Ask anything about your studies...">
        <button class="send" onclick="send()">Send</button>
    </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || {};
let currentChat = localStorage.getItem("currentChat");

if (!currentChat || !chats[currentChat]) {
    currentChat = Date.now().toString();
    chats[currentChat] = [];
}

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const historyList = document.getElementById("historyList");

function save() {
    localStorage.setItem("chats", JSON.stringify(chats));
    localStorage.setItem("currentChat", currentChat);
}

function newChat() {
    currentChat = Date.now().toString();
    chats[currentChat] = [];
    save();
    loadChat();
}

function loadChat() {
    messagesEl.innerHTML = "";
    (chats[currentChat] || []).forEach(msg => {
        addMessage(msg.content, msg.role === "user" ? "user" : "ai");
    });
    renderHistory();
}

function renderHistory() {
    historyList.innerHTML = "";
    const sorted = Object.entries(chats).sort((a,b) => Number(b[0]) - Number(a[0]));
    
    sorted.slice(0, 12).forEach(([id, msgs]) => {
        const div = document.createElement("div");
        div.className = "chat-item";
        const preview = msgs.find(m => m.role === "user")?.content || "New Chat";
        div.innerText = preview.slice(0, 28) + (preview.length > 28 ? "..." : "");
        div.onclick = () => {
            currentChat = id;
            save();
            loadChat();
        };
        historyList.appendChild(div);
    });
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerText = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    chats[currentChat].push({ role: "user", content: text });
    input.value = "";

    const typing = document.createElement("div");
    typing.className = "msg ai";
    typing.innerText = "Thinking...";
    messagesEl.appendChild(typing);

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history: chats[currentChat] })
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        messagesEl.removeChild(typing);
        addMessage(data.reply || "Sorry, I couldn't process that.", "ai");
        chats[currentChat].push({ role: "assistant", content: data.reply });

    } catch (e) {
        if (typing.parentNode) messagesEl.removeChild(typing);
        addMessage("Error: AI service unavailable right now.", "ai");
    }

    save();
    renderHistory();
}

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

loadChat();
</script>

<div style="position:fixed;top:15px;left:15px;">
    <a href="index.html" style="color:white;opacity:0.8;text-decoration:none;">← Back</a>
</div>

</body>
</html>
