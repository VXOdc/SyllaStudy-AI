<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Tutor • Vxo Study OS</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
}
.sidebar { width: 320px; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); padding: 24px; border-right: 1px solid rgba(255,255,255,0.15); }
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
.card { width: 100%; max-width: 520px; background: rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; backdrop-filter: blur(16px); text-align: center; }
.question { font-size: 34px; margin-bottom: 24px; }
input { width: 100%; padding: 16px; font-size: 20px; border-radius: 16px; border: none; margin-bottom: 16px; }
button { padding: 14px 32px; font-size: 17px; background: white; color: black; border: none; border-radius: 9999px; cursor: pointer; font-weight: 700; }
#feedback { margin-top: 20px; font-size: 20px; min-height: 32px; }
.skill { background: rgba(255,255,255,0.1); margin-bottom: 14px; padding: 14px; border-radius: 16px; }
.bar { height: 10px; background: #222; border-radius: 999px; overflow: hidden; margin-top: 8px; }
.fill { height: 100%; background: linear-gradient(90deg, #ffcc00, #ff8800); }
</style>
</head>
<body>

<div class="sidebar">
    <h2 style="text-align:center;margin:0 0 20px 0;">🌴 Skill Dashboard</h2>
    <div id="skills"></div>
    <div style="margin-top:30px;text-align:center;font-size:15px;">
        🔥 Streak: <span id="streak">0</span><br>
        ⭐ XP: <span id="xp">0</span><br>
        🏆 Level: <span id="level">1</span>
    </div>
</div>

<div class="main">
    <div class="card">
        <div class="question" id="question">Loading tropical question…</div>
        <input id="answer" type="number" placeholder="Your answer here">
        <button onclick="submitAnswer()">Submit Answer</button>
        <div id="feedback"></div>
    </div>
</div>

<script>
/* Same powerful adaptive logic as before – just cleaned up */
let state = JSON.parse(localStorage.getItem("tutorState")) || {
    xp: 0, level: 1, streak: 0, lastActive: null,
    skills: { addition: {level:1,correct:0,wrong:0}, subtraction: {level:1,correct:0,wrong:0}, multiplication: {level:1,correct:0,wrong:0} }
};
let currentQ = null;

function updateStreak() {
    const today = new Date().toDateString();
    if (state.lastActive !== today) { state.streak++; state.lastActive = today; }
}

function pickSkill() {
    return Object.entries(state.skills).sort((a,b) => (a[1].wrong - a[1].correct) - (b[1].wrong - b[1].correct))[0][0];
}

function generateQuestion(skill) {
    const lvl = state.skills[skill].level;
    const max = lvl * 9;
    const a = Math.floor(Math.random()*max), b = Math.floor(Math.random()*max);
    if (skill==="addition") return {q: `${a} + ${b}`, ans: a+b, skill};
    if (skill==="subtraction") return {q: `${Math.max(a,b)} - ${Math.min(a,b)}`, ans: Math.abs(a-b), skill};
    return {q: `${a} × ${b}`, ans: a*b, skill};
}

function nextQuestion() {
    const skill = pickSkill();
    currentQ = generateQuestion(skill);
    document.getElementById("question").innerText = currentQ.q;
    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerHTML = "";
}

function submitAnswer() {
    const userAns = Number(document.getElementById("answer").value);
    const fb = document.getElementById("feedback");
    const skill = state.skills[currentQ.skill];

    if (userAns === currentQ.ans) {
        fb.innerHTML = `<span style="color:#4ade80">✅ Perfect!</span>`;
        skill.correct++; state.xp += 15;
        if (skill.correct >= 5) { skill.level++; skill.correct=0; skill.wrong=0; }
    } else {
        fb.innerHTML = `<span style="color:#f87171">❌ The answer was ${currentQ.ans}</span>`;
        skill.wrong++;
        if (skill.wrong >= 3) { skill.level = Math.max(1, skill.level-1); skill.wrong=0; }
    }

    if (state.xp >= state.level * 70) { state.level++; state.xp = 0; }

    localStorage.setItem("tutorState", JSON.stringify(state));
    renderDashboard();
    setTimeout(nextQuestion, 1300);
}

function renderDashboard() {
    document.getElementById("xp").innerText = state.xp;
    document.getElementById("level").innerText = state.level;
    document.getElementById("streak").innerText = state.streak;

    const container = document.getElementById("skills");
    container.innerHTML = "";
    Object.entries(state.skills).forEach(([name, data]) => {
        const pct = Math.min(100, data.level * 20);
        const div = document.createElement("div");
        div.className = "skill";
        div.innerHTML = `<strong>${name}</strong><div class="bar"><div class="fill" style="width:${pct}%"></div></div><small>Level ${data.level}</small>`;
        container.appendChild(div);
    });
}

updateStreak();
renderDashboard();
nextQuestion();
</script>

<div style="position:fixed;top:20px;left:20px;">
    <a href="index.html" style="color:white;opacity:0.85;text-decoration:none;font-size:16px;">← Home</a>
</div>
</body>
</html>
