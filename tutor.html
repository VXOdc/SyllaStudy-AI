<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Tutor OS</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: radial-gradient(circle at top, #111, #000);
    color: white;
    display: flex;
    height: 100vh;
}

/* SIDEBAR DASHBOARD */
.sidebar {
    width: 300px;
    background: rgba(255,255,255,0.04);
    border-right: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    padding: 15px;
}

.title {
    font-size: 18px;
    margin-bottom: 10px;
}

/* SKILL CARDS */
.skill {
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
}

.bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 6px;
}

.fill {
    height: 100%;
    width: 0%;
    background: white;
}

/* MAIN AREA */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.card {
    width: 60%;
    max-width: 500px;
    padding: 20px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    text-align: center;
}

.question {
    font-size: 26px;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 16px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
}

/* STATS */
.stats {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="title">📊 Skill Dashboard</div>
    <div id="skills"></div>

    <div class="stats">
        <div>🔥 Streak: <span id="streak">0</span></div>
        <div>⭐ XP: <span id="xp">0</span></div>
        <div>🏆 Level: <span id="level">1</span></div>
    </div>
</div>

<div class="main">
    <div class="card">
        <div class="question" id="question">Loading...</div>

        <input id="answer" placeholder="Type answer...">
        <button onclick="submitAnswer()">Submit</button>

        <div id="feedback"></div>
    </div>
</div>

<script>
/* -----------------------------
   STATE SYSTEM
------------------------------*/

let state = JSON.parse(localStorage.getItem("tutor")) || {
    xp: 0,
    level: 1,
    streak: 0,
    lastActive: null,
    skills: {
        addition: { level: 1, correct: 0, wrong: 0 },
        subtraction: { level: 1, correct: 0, wrong: 0 },
        multiplication: { level: 1, correct: 0, wrong: 0 }
    }
};

let current = null;

/* -----------------------------
   STREAK SYSTEM
------------------------------*/

function updateStreak() {
    const today = new Date().toDateString();

    if (state.lastActive !== today) {
        state.streak = (state.streak || 0) + 1;
        state.lastActive = today;
    }
}

/* -----------------------------
   SKILL LOGIC
------------------------------*/

function pickSkill() {
    const entries = Object.entries(state.skills);

    entries.sort((a,b)=>
        (a[1].wrong - a[1].correct) - (b[1].wrong - b[1].correct)
    );

    return entries[0][0];
}

function generateQuestion(skill) {
    const level = state.skills[skill].level;
    const max = level * 10;

    const a = Math.floor(Math.random() * max);
    const b = Math.floor(Math.random() * max);

    if (skill === "addition") return { q: `${a} + ${b}`, a: a + b, skill };
    if (skill === "subtraction") return { q: `${a} - ${b}`, a: a - b, skill };
    if (skill === "multiplication") return { q: `${a} * ${b}`, a: a * b, skill };
}

/* -----------------------------
   GAME LOOP
------------------------------*/

function next() {
    const skill = pickSkill();
    current = generateQuestion(skill);

    document.getElementById("question").innerText = current.q;
    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerText = "";
}

/* -----------------------------
   ANSWER CHECKING
------------------------------*/

function submitAnswer() {
    const val = Number(document.getElementById("answer").value);
    const fb = document.getElementById("feedback");

    const skill = state.skills[current.skill];

    if (val === current.a) {
        fb.innerText = "Correct!";
        skill.correct++;
        state.xp += 10;

        if (skill.correct >= 5) {
            skill.level++;
            skill.correct = 0;
            skill.wrong = 0;
        }

    } else {
        fb.innerText = `Wrong. Answer: ${current.a}`;
        skill.wrong++;

        if (skill.wrong >= 3) {
            skill.level = Math.max(1, skill.level - 1);
            skill.wrong = 0;
        }
    }

    if (state.xp >= state.level * 50) {
        state.level++;
        state.xp = 0;
    }

    save();
    render();
    next();
}

/* -----------------------------
   UI RENDER
------------------------------*/

function render() {
    document.getElementById("xp").innerText = state.xp;
    document.getElementById("level").innerText = state.level;
    document.getElementById("streak").innerText = state.streak;

    const container = document.getElementById("skills");
    container.innerHTML = "";

    for (let [name, s] of Object.entries(state.skills)) {
        const percent = Math.min(100, s.level * 20);

        const div = document.createElement("div");
        div.className = "skill";
        div.innerHTML = `
            <div>${name}</div>
            <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
        `;
        container.appendChild(div);
    }
}

/* -----------------------------
   SAVE
------------------------------*/

function save() {
    localStorage.setItem("tutor", JSON.stringify(state));
}

/* -----------------------------
   INIT
------------------------------*/

updateStreak();
render();
next();
save();
</script>

</body>
</html>
