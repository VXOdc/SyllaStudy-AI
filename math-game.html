<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Game • Sylla AI</title>
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.11);
        --glass-border: rgba(255, 255, 255, 0.28);
        --glass-blur: 32px;
        --accent: #ffd60a;
        --text: #ffffff;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.82)),
                    url("https://images6.alphacoders.com/526/526622.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text);
        display: flex;
        height: 100vh;
        overflow: hidden;
        position: relative;
    }

    .sidebar {
        width: 340px;
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border-right: 1px solid var(--glass-border);
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow);
        z-index: 10;
    }

    .home-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 10px 16px;
        border-radius: 999px;
        width: fit-content;
        margin-bottom: 24px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .home-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
    }

    .sidebar h2 {
        text-align: center;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 32px 0;
        letter-spacing: -0.5px;
    }

    .skill-card {
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        padding: 18px 20px;
        margin-bottom: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .skill-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .skill-name {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .bar-container {
        height: 10px;
        background: #1c1c1e;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
    }

    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffd60a, #ff9f0a);
        transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        border-radius: 9999px;
    }

    .level-label {
        font-size: 13px;
        opacity: 0.75;
        margin-top: 6px;
        display: block;
    }

    .stats {
        margin-top: auto;
        padding-top: 32px;
        border-top: 1px solid rgba(255,255,255,0.15);
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 15px;
    }

    .stat-item {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .reset-btn {
        margin-top: 24px;
        padding: 12px 20px;
        background: rgba(255,59,48,0.12);
        color: #ff3b30;
        border: 1px solid rgba(255,59,48,0.3);
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
    }

    .reset-btn:hover {
        background: rgba(255,59,48,0.2);
        transform: scale(1.03);
    }

    .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
    }

    .game-card {
        width: 100%;
        max-width: 620px;
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: 48px 32px 52px 28px; 
        padding: 64px 56px;
        text-align: center;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
    }

    .game-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
        pointer-events: none;
        opacity: 0.6;
    }

    .question {
        font-size: 48px;
        font-weight: 500;
        margin-bottom: 48px;
        min-height: 68px;
        letter-spacing: -1px;
    }

    input {
        width: 100%;
        padding: 24px 28px;
        font-size: 28px;
        text-align: center;
        border: none;
        border-radius: 24px;
        background: rgba(255,255,255,0.95);
        color: #111;
        outline: none;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    input:focus {
        transform: scale(1.02);
        box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    .submit-btn {
        margin-top: 32px;
        padding: 18px 52px;
        font-size: 17px;
        font-weight: 700;
        background: rgba(255,255,255,0.95);
        color: #111;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .submit-btn:hover {
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    #feedback {
        margin-top: 32px;
        font-size: 24px;
        font-weight: 600;
        min-height: 40px;
    }

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal.show {
        display: flex;
        opacity: 1;
    }

    .modal-content {
        background: rgba(255,255,255,0.97);
        color: #111;
        border-radius: 28px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
        font-size: 24px;
        margin-bottom: 12px;
    }

    .modal-content p {
        color: #555;
        margin-bottom: 32px;
        line-height: 1.5;
    }

    .modal-buttons {
        display: flex;
        gap: 16px;
    }

    .modal-buttons button {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 16px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
    }

    .cancel-btn {
        background: #f0f0f0;
        color: #111;
    }

    .reset-confirm-btn {
        background: #ff3b30;
        color: white;
    }
</style>
</head>
<body>

<div class="sidebar">
    <a href="index.html" class="home-btn">← Home</a>
    <h2>Skill Dashboard</h2>

    <div class="skill-card" id="addition-card">
        <div class="skill-name">
            <span>Addition</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="addition-bar" style="width: 0%"></div>
        </div>
        <div class="level-label" id="addition-level">Level 1</div>
    </div>

    <div class="skill-card" id="subtraction-card">
        <div class="skill-name">
            <span>Subtraction</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="subtraction-bar" style="width: 0%"></div>
        </div>
        <div class="level-label" id="subtraction-level">Level 1</div>
    </div>

    <div class="skill-card" id="multiplication-card">
        <div class="skill-name">
            <span>Multiplication</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="multiplication-bar" style="width: 0%"></div>
        </div>
        <div class="level-label" id="multiplication-level">Level 1</div>
    </div>

    <div class="stats">
        <div class="stat-item">🔥 Streak: <span id="streak">0</span></div>
        <div class="stat-item">⭐ XP: <span id="xp">0</span></div>
        <div class="stat-item">🏆 Level: <span id="level">1</span></div>
    </div>

    <button class="reset-btn" onclick="showResetModal()">
        Reset All Progress
    </button>
</div>

<div class="main">
    <div class="game-card">
        <div class="question" id="question">Loading question…</div>
        
        <input 
            id="answer" 
            type="number" 
            placeholder="Type your answer"
            autocomplete="off"
            onkeydown="if(event.key === 'Enter') submitAnswer()">
        
        <button class="submit-btn" onclick="submitAnswer()">
            Submit Answer
        </button>

        <div id="feedback"></div>
    </div>
</div>

<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3>Reset All Progress?</h3>
        <p>This action cannot be undone.<br>All streaks, XP, and skill levels will be permanently deleted.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="hideResetModal()">Cancel</button>
            <button class="reset-confirm-btn" onclick="resetProgress()">Reset Everything</button>
        </div>
    </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem("tutorState")) || {
    xp: 0,
    level: 1,
    streak: 0,
    lastActive: null,
    skills: {
        addition:     { level: 1, correct: 0, wrong: 0 },
        subtraction:  { level: 1, correct: 0, wrong: 0 },
        multiplication: { level: 1, correct: 0, wrong: 0 }
    }
};

let currentQuestion = null;

function updateStreak() {
    const today = new Date().toDateString();
    if (state.lastActive !== today) {
        state.streak++;
        state.lastActive = today;
    }
}

function pickSkill() {
    return Object.entries(state.skills)
        .sort((a, b) => (a[1].wrong - a[1].correct) - (b[1].wrong - b[1].correct))[0][0];
}

function generateQuestion(skill) {
    const lvl = state.skills[skill].level;
    const max = Math.max(5, lvl * 9);
    const a = Math.floor(Math.random() * max);
    const b = Math.floor(Math.random() * max);

    if (skill === "addition") return { q: `${a} + ${b}`, ans: a + b, skill };
    if (skill === "subtraction") return { q: `${Math.max(a,b)} - ${Math.min(a,b)}`, ans: Math.abs(a - b), skill };
    return { q: `${a} × ${b}`, ans: a * b, skill };
}

function nextQuestion() {
    currentQuestion = generateQuestion(pickSkill());
    document.getElementById("question").innerText = currentQuestion.q;
    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerHTML = "";
    document.getElementById("answer").focus();
}

function submitAnswer() {
    const userAnswer = Number(document.getElementById("answer").value.trim());
    if (isNaN(userAnswer) || document.getElementById("answer").value.trim() === "") return;

    const feedbackEl = document.getElementById("feedback");
    const skillData = state.skills[currentQuestion.skill];

    if (userAnswer === currentQuestion.ans) {
        feedbackEl.innerHTML = `<span style="color:#30d158">✅ Perfect!</span>`;
        skillData.correct++;
        state.xp += 15;

        if (skillData.correct >= 5) {
            skillData.level++;
            skillData.correct = 0;
            skillData.wrong = 0;
        }
    } else {
        feedbackEl.innerHTML = `<span style="color:#ff3b30">❌ The answer was ${currentQuestion.ans}</span>`;
        skillData.wrong++;
        if (skillData.wrong >= 3) {
            skillData.level = Math.max(1, skillData.level - 1);
            skillData.wrong = 0;
        }
    }

    if (state.xp >= state.level * 70) {
        state.level++;
        state.xp = 0;
    }

    localStorage.setItem("tutorState", JSON.stringify(state));
    renderDashboard();
    setTimeout(nextQuestion, 1650);
}

function renderDashboard() {
    document.getElementById("xp").innerText = state.xp;
    document.getElementById("level").innerText = state.level;
    document.getElementById("streak").innerText = state.streak;

    const addPct = Math.min(100, state.skills.addition.level * 22);
    document.getElementById("addition-bar").style.width = addPct + "%";
    document.getElementById("addition-level").innerText = `Level ${state.skills.addition.level}`;

    const subPct = Math.min(100, state.skills.subtraction.level * 22);
    document.getElementById("subtraction-bar").style.width = subPct + "%";
    document.getElementById("subtraction-level").innerText = `Level ${state.skills.subtraction.level}`;

    const mulPct = Math.min(100, state.skills.multiplication.level * 22);
    document.getElementById("multiplication-bar").style.width = mulPct + "%";
    document.getElementById("multiplication-level").innerText = `Level ${state.skills.multiplication.level}`;
}

function showResetModal() {
    document.getElementById("resetModal").classList.add("show");
}

function hideResetModal() {
    document.getElementById("resetModal").classList.remove("show");
}

function resetProgress() {
    if (confirm("Final confirmation — reset ALL progress forever?")) {
        localStorage.removeItem("tutorState");
        location.reload();
    }
}

function init() {
    updateStreak();
    renderDashboard();
    nextQuestion();

    const answerInput = document.getElementById("answer");
    answerInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") submitAnswer();
    });
}

init();
</script>

</body>
</html>
