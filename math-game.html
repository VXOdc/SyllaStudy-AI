<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Game • Vxo Study OS</title>
<style>
:root {
    --glass: rgba(255,255,255,0.11);
    --border: rgba(255,255,255,0.22);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(rgba(0,0,0,0.52), rgba(0,0,0,0.85)),
                url("https://images6.alphacoders.com/526/526622.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 340px;
    background: var(--glass);
    backdrop-filter: blur(32px);
    border-right: 1px solid var(--border);
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
}

h2 {
    text-align: center;
    margin: 0 0 32px 0;
    font-size: 24px;
    font-weight: 600;
}

/* Skills */
.skill {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    margin-bottom: 16px;
    padding: 18px;
    border-radius: 20px;
}

.bar {
    height: 10px;
    background: #1c1c1e;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
}

.fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd60a, #ff9f0a);
    transition: width 0.6s ease;
}

/* Stats */
.stats {
    margin-top: auto;
    text-align: center;
    font-size: 15px;
    line-height: 1.8;
}

/* Main Game Area */
.main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
}

.card {
    width: 100%;
    max-width: 560px;
    background: var(--glass);
    backdrop-filter: blur(32px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 52px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}

.question {
    font-size: 42px;
    font-weight: 500;
    margin-bottom: 36px;
    min-height: 54px;
}

input {
    width: 100%;
    padding: 20px 24px;
    font-size: 26px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.95);
    color: #000;
    margin-bottom: 24px;
    outline: none;
    text-align: center;
}

button.submit {
    padding: 16px 48px;
    font-size: 17px;
    font-weight: 600;
    background: white;
    color: black;
    border: none;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.2s ease;
}

button.submit:hover {
    transform: scale(1.04);
    background: #f0f0f0;
}

/* Feedback */
#feedback {
    margin-top: 28px;
    font-size: 23px;
    min-height: 38px;
    font-weight: 500;
}

/* Reset Button */
.reset-btn {
    margin-top: 20px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.1);
    color: #ff3b30;
    border: 1px solid rgba(255,59,48,0.3);
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
}

/* Confirmation Modal */
.modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.modal.show {
    display: flex;
    opacity: 1;
}

.modal-content {
    background: rgba(255,255,255,0.95);
    color: #000;
    border-radius: 24px;
    padding: 32px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.modal-content h3 {
    margin: 0 0 16px 0;
    font-size: 22px;
}

.modal-content p {
    color: #555;
    margin-bottom: 32px;
}

.modal-buttons {
    display: flex;
    gap: 12px;
}

.modal-buttons button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.cancel {
    background: #e5e5e7;
    color: #000;
}

.reset-confirm {
    background: #ff3b30;
    color: white;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>Skill Dashboard</h2>
    <div id="skills"></div>
    
    <div class="stats">
        🔥 Streak: <span id="streak">0</span><br>
        ⭐ XP: <span id="xp">0</span><br>
        🏆 Level: <span id="level">1</span>
    </div>

    <button class="reset-btn" onclick="showResetModal()">Reset All Progress</button>
</div>

<div class="main">
    <div class="card">
        <div class="question" id="question">Loading question…</div>
        <input id="answer" type="number" placeholder="Type your answer" autocomplete="off">
        <button class="submit" onclick="submitAnswer()">Submit Answer</button>
        <div id="feedback"></div>
    </div>
</div>

<!-- Reset Confirmation Modal -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3>Reset Progress?</h3>
        <p>This will delete all your streaks, XP, and skill levels.<br>Are you sure?</p>
        <div class="modal-buttons">
            <button class="cancel" onclick="hideResetModal()">Cancel</button>
            <button class="reset-confirm" onclick="resetProgress()">Reset Everything</button>
        </div>
    </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem("tutorState")) || {
    xp: 0, level: 1, streak: 0, lastActive: null,
    skills: {
        addition: {level:1, correct:0, wrong:0},
        subtraction: {level:1, correct:0, wrong:0},
        multiplication: {level:1, correct:0, wrong:0}
    }
};
let currentQ = null;

function updateStreak() {
    const today = new Date().toDateString();
    if (state.lastActive !== today) {
        state.streak++;
        state.lastActive = today;
    }
}

function pickSkill() {
    return Object.entries(state.skills)
        .sort((a,b) => (a[1].wrong - a[1].correct) - (b[1].wrong - b[1].correct))[0][0];
}

function generateQuestion(skill) {
    const lvl = state.skills[skill].level;
    const max = lvl * 9;
    const a = Math.floor(Math.random() * max);
    const b = Math.floor(Math.random() * max);
    
    if (skill === "addition") return {q: `${a} + ${b}`, ans: a + b, skill};
    if (skill === "subtraction") return {q: `${Math.max(a,b)} - ${Math.min(a,b)}`, ans: Math.abs(a - b), skill};
    return {q: `${a} × ${b}`, ans: a * b, skill};
}

function nextQuestion() {
    currentQ = generateQuestion(pickSkill());
    document.getElementById("question").innerText = currentQ.q;
    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerHTML = "";
}

function submitAnswer() {
    const userAns = Number(document.getElementById("answer").value.trim());
    if (isNaN(userAns)) return;

    const fb = document.getElementById("feedback");
    const skill = state.skills[currentQ.skill];

    if (userAns === currentQ.ans) {
        fb.innerHTML = `<span style="color:#30d158">✅ Perfect!</span>`;
        skill.correct++;
        state.xp += 15;
        if (skill.correct >= 5) {
            skill.level++;
            skill.correct = 0;
            skill.wrong = 0;
        }
    } else {
        fb.innerHTML = `<span style="color:#ff3b30">❌ The answer was ${currentQ.ans}</span>`;
        skill.wrong++;
        if (skill.wrong >= 3) {
            skill.level = Math.max(1, skill.level - 1);
            skill.wrong = 0;
        }
    }

    if (state.xp >= state.level * 70) {
        state.level++;
        state.xp = 0;
    }

    localStorage.setItem("tutorState", JSON.stringify(state));
    renderDashboard();
    setTimeout(nextQuestion, 1600);
}

// Enter key support
document.getElementById("answer").addEventListener("keypress", function(e) {
    if (e.key === "Enter") submitAnswer();
});

function renderDashboard() {
    document.getElementById("xp").innerText = state.xp;
    document.getElementById("level").innerText = state.level;
    document.getElementById("streak").innerText = state.streak;

    const container = document.getElementById("skills");
    container.innerHTML = "";
    Object.entries(state.skills).forEach(([name, data]) => {
        const pct = Math.min(100, data.level * 22);
        const div = document.createElement("div");
        div.className = "skill";
        div.innerHTML = `
            <strong>${name.charAt(0).toUpperCase() + name.slice(1)}</strong>
            <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
            <small style="opacity:0.8">Level ${data.level}</small>
        `;
        container.appendChild(div);
    });
}

/* Reset Progress */
function showResetModal() {
    document.getElementById("resetModal").classList.add("show");
}

function hideResetModal() {
    document.getElementById("resetModal").classList.remove("show");
}

function resetProgress() {
    if (confirm("Final confirmation: Reset ALL math game progress?")) {
        localStorage.removeItem("tutorState");
        location.reload();
    }
}

updateStreak();
renderDashboard();
nextQuestion();
</script>

<div style="position:fixed; top:28px; left:28px;">
    <a href="index.html" style="color:white; opacity:0.9; text-decoration:none; font-size:16px;">← Home</a>
</div>
</body>
</html>
