<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Engine</title>
<style>
body {
    margin:0;
    font-family: Arial;
    background:#000;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar {
    width:240px;
    background:#111;
    padding:10px;
}

.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages {
    flex:1;
    padding:20px;
    overflow:auto;
}

.msg {
    margin:10px 0;
}

.user { color:#fff; }
.ai { color:#aaa; }

.input {
    display:flex;
    padding:10px;
    background:#111;
}

input {
    flex:1;
    padding:10px;
}

button {
    margin-left:10px;
}
</style>
</head>

<body>

<div class="sidebar">
<h3>Math OS</h3>
</div>

<div class="main">
<div id="messages" class="messages"></div>

<div class="input">
<input id="input" placeholder="Type equation like 2+2*5">
<button onclick="send()">Send</button>
</div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function add(text, cls){
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    messages.appendChild(div);
}

function isMath(text){
    return /^[0-9+\-*/().\s]+$/.test(text);
}

function solve(expr){
    try {
        return Function("return ("+expr+")")();
    } catch {
        return null;
    }
}

function send(){
    const text = input.value.trim();
    if(!text) return;

    add(text,"user");

    if(isMath(text)){
        const result = solve(text);
        if(result !== null){
            add("Answer: " + result, "ai");
        } else {
            add("Invalid math", "ai");
        }
    } else {
        add("Not a math expression", "ai");
    }

    input.value = "";
}
</script>

</body>
</html>
