<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Engine</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav">
    <a href="index.html">Home</a>
    <a href="math.html">Math</a>
    <a href="chat.html">Assistant</a>
    <a href="about.html">About</a>
</nav>

<div class="math-page">

    <div class="math-card">

        <h1>Math Engine</h1>

        <div class="question" id="question">Loading...</div>

        <input id="answer" type="number" placeholder="?">

        <br>

        <button onclick="check()">Submit</button>

        <div id="result"></div>

    </div>

</div>

<script>
let a, b, op;

function newQ() {
    a = Math.floor(Math.random()*12);
    b = Math.floor(Math.random()*12);

    const ops = ["+", "-", "×"];
    op = ops[Math.floor(Math.random()*3)];

    document.getElementById("question").innerText = `${a} ${op} ${b}`;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";
}

function getAnswer() {
    if (op === "+") return a + b;
    if (op === "-") return a - b;
    return a * b;
}

function check() {
    const val = Number(document.getElementById("answer").value);
    const res = document.getElementById("result");

    if (val === getAnswer()) {
        res.innerText = "Correct";
        res.style.color = "lightgreen";
    } else {
        res.innerText = "Wrong";
        res.style.color = "red";
    }

    setTimeout(newQ, 700);
}

document.getElementById("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") check();
});

newQ();
</script>

</body>
</html>
