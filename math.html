<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Assistant • Vxo Study OS</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                url("https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?auto=format&fit=crop&w=2000&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    height: 100vh;
}
.sidebar { width: 280px; background:rgba(0,0,0,0.5); backdrop-filter:blur(20px); padding:20px; border-right:1px solid rgba(255,255,255,0.15); }
.main { flex:1; display:flex; flex-direction:column; }
.messages { flex:1; padding:24px; overflow-y:auto; }
.msg { margin:14px 0; max-width:75%; padding:14px 18px; border-radius:18px; }
.user { background:rgba(255,255,255,0.95); color:#000; margin-left:auto; }
.ai { background:rgba(255,255,255,0.18); }
.inputBar { padding:16px; background:rgba(0,0,0,0.6); backdrop-filter:blur(12px); display:flex; }
input { flex:1; padding:14px; border:none; background:rgba(255,255,255,0.15); color:white; border-radius:9999px; font-size:16px; }
button { margin-left:12px; padding:14px 24px; border-radius:9999px; background:white; color:black; font-weight:700; border:none; cursor:pointer; }
</style>
</head>
<body>

<div class="sidebar">
    <h2>Math Assistant</h2>
    <p style="opacity:0.8;font-size:15px;">Type any math problem.<br>Example: 45 + 67 or 12 × 8 or 144 / 12</p>
</div>

<div class="main">
    <div id="messages" class="messages"></div>
    <div class="inputBar">
        <input id="input" placeholder="Enter your math question...">
        <button onclick="send()">Solve</button>
    </div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function add(text, type) {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerText = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function isMath(t) { return /^[0-9+\-*/().\s]+$/.test(t.trim()); }

function solve(expr) {
    try { return Function(`"use strict";return(${expr})`)(); }
    catch { return null; }
}

function send() {
    let text = input.value.trim();
    if (!text) return;
    add(text, "user");

    if (isMath(text)) {
        const result = solve(text);
        if (result !== null) add(`✅ Answer: ${result}`, "ai");
        else add("❌ Could not calculate that expression", "ai");
    } else {
        add("💡 Try a math expression like 23 + 45 or 9 × 12", "ai");
    }
    input.value = "";
}
</script>

<div style="position:fixed;top:20px;left:20px;">
    <a href="index.html" style="color:white;opacity:0.85;text-decoration:none;">← Home</a>
</div>
</body>
</html>
