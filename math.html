<!DOCTYPE html>
<html>
<head>
<title>Math Engine</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="math.html">Math</a>
    <a href="chat.html">Assistant</a>
    <a href="about.html">About</a>
</div>

<div class="fullscreen">
    <div class="card">

        <h2>Math Engine</h2>

        <div id="q">Loading...</div>
        <br>

        <input id="a" type="number">
        <br><br>

        <button onclick="check()">Submit</button>

        <p id="r"></p>

    </div>
</div>

<script>
let x, y;

function newQ() {
    x = Math.floor(Math.random() * 10);
    y = Math.floor(Math.random() * 10);
    document.getElementById("q").innerText = `${x} + ${y} = ?`;
    document.getElementById("a").value = "";
    document.getElementById("r").innerText = "";
}

function check() {
    let val = Number(document.getElementById("a").value);
    let r = document.getElementById("r");

    if (val === x + y) {
        r.innerText = "Correct";
        r.style.color = "lightgreen";
    } else {
        r.innerText = "Wrong";
        r.style.color = "red";
    }

    setTimeout(newQ, 700);
}

newQ();
</script>

</body>
</html>
