<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VxoDC</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: #000;
    color: #fff;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: clamp(48px, 6vw, 80px);
    margin: 0;
    letter-spacing: -1px;
}

p {
    color: #aaa;
    max-width: 600px;
    margin-top: 12px;
    font-size: 16px;
}

/* CARDS */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    max-width: 900px;
    margin: -80px auto 80px;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 20px;
    backdrop-filter: blur(12px);
    transition: 0.25s ease;
}

.card:hover {
    transform: translateY(-6px);
    background: rgba(255,255,255,0.08);
}

.card h2 {
    margin: 0;
    font-size: 18px;
}

.card p {
    font-size: 13px;
    color: #bbb;
    margin-top: 8px;
}

.card a {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    background: white;
    color: black;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>Vxo Study OS</h1>
    <p>A lightweight student system for math practice and simple productivity tools.</p>
</div>

<div class="grid">

    <div class="card">
        <h2>Math Engine</h2>
        <p>Practice addition, subtraction, and multiplication.</p>
        <a href="math.html">Open</a>
    </div>

    <div class="card">
        <h2>About</h2>
        <p>What this project is and how it was built.</p>
        <a href="about.html">View</a>
    </div>

</div>

</body>
</html>
