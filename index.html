<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus AI</title>
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.12);
            --glass-border: rgba(255,255,255,0.25);
            --glass-blur: 32px;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.78)),
                        url("https://media.cntraveler.com/photos/67ed8fae06a38df1bc3aa790/16:9/w_6000,h_3375,c_limit/Plage%20Notre-Dame%20Porquerolles%20GettyImages-2119112839.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 20px 0;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 1000;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15.5px;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 9999px;
            transition: 0.3s;
        }
        nav a:hover {
            background: rgba(255,255,255,0.18);
        }

        .header {
            text-align: center;
            padding-top: 180px;
            padding-bottom: 60px;
        }
        .header h1 {
            font-size: 74px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -2.5px;
            text-shadow: 0 6px 40px rgba(0,0,0,0.6);
        }
        .header p {
            font-size: 20px;
            color: #ddd;
            max-width: 640px;
            margin: 16px auto 0;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 36px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px 32px;
            width: 340px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .glass-card:hover {
            transform: translateY(-16px) scale(1.04);
            background: rgba(255,255,255,0.20);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .glass-card h2 {
            font-size: 28px;
            margin: 0 0 14px 0;
            font-weight: 600;
        }
        .glass-card p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.55;
        }
        .btn {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 36px;
            background: rgba(255,255,255,0.95);
            color: #000;
            font-weight: 700;
            border-radius: 9999px;
            text-decoration: none;
            font-size: 15.2px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: white;
            transform: scale(1.06);
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="math-game.html">Math Game</a>
    <a href="chat.html">Study AI</a>
    <a href="about.html">About</a>
</nav>

<div class="header">
    <h1>Syllabus AI</h1>

</div>

<div class="cards">
    <div class="glass-card">
        <h2>Math Game</h2>
        <p>Adaptive practice with XP, streaks, levels and skill tracking.</p>
        <a href="math-game.html" class="btn">Open Math Game</a>
    </div>

    <div class="glass-card">
        <h2>Study AI</h2>
        <p>Ask anything about your studies. Powered by Mistral AI.</p>
        <a href="chat.html" class="btn">Open Study AI</a>
    </div>
</div>

</body>
</html>
