<section class="hero">
    <h1>Vxo Study OS</h1>

<section class="grid">

    <div class="card">
        <h2>Math Engine</h2>
        <p>Practice addition, subtraction, and multiplication.</p>

    <div class="card">
        <h2>About</h2>
        <p>Learn how this system works.</p>
        <a href="about.html">Read</a>
    </div>

</section>

<script>
/* page fade animation */
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});

document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", e => {
        if (link.href && !link.href.includes("#")) {
            e.preventDefault();
            document.body.classList.remove("loaded");
            setTimeout(() => window.location = link.href, 300);
        }
    });
});
</script>

</body>
