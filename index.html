<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vxo Study OS</title>

    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Import script.js which contains the main application logic -->
    <script defer src="/script.js"></script>
</head>
<body>
    <!-- Sidebar and Main Content -->
    <div class="sidebar">
        <button class="newChat" onclick="newChat()">+ New Chat</button>
        <div id="historyList" class="history"></div>
    </div>

    <div class="main">
        <div id="messages" class="messages"></div>

        <div class="inputBar">
            <input id="input" placeholder="Ask anything..." />
            <button class="send" onclick="send()">Send</button>
        </div>
    </div>

    <!-- Back button to index.html -->
    <div style="position:fixed;top:15px;left:15px;">
        <a href="index.html" style="color:white;opacity:0.7;text-decoration:none;">← Back</a>
    </div>
</body>
</html>
