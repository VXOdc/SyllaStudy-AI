<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vxo Study OS</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: radial-gradient(circle at top, #111, #000);
    color: white;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 12px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
}

nav a {
    color: #aaa;
    text-decoration: none;
}

nav a:hover { color: white; }

/* HEADER */
.header {
    text-align: center;
    padding-top: 120px;
}

.header h1 {
    font-size: 60px;
    margin: 0;
}

.header p {
    color: #aaa;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    transition: 0.2s;
}

.card:hover { transform: translateY(-5px); }

.card a {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: white;
    color: black;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="math.html">Math</a>
    <a href="chat.html">Study Assistant</a>
    <a href="about.html">About</a>
</nav>

<div class="header">
    <h1>Vxo Study OS</h1>
    <p>A simple learning system with math + AI + memory</p>
</div>

<div class="grid">

    <div class="card">
        <h2>Math Engine</h2>
        <p>Instant solving + practice</p>
        <a href="math.html">Open</a>
    </div>

    <div class="card">
        <h2>Study Assistant</h2>
        <p>AI help + explanations</p>
        <a href="chat.html">Open</a>
    </div>

    <div class="card">
        <h2>About</h2>
        <p>What this system is</p>
        <a href="about.html">Read</a>
    </div>

</div>

</body>
</html>
