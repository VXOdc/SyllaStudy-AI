<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow • SyllaStudy AI</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Inter, sans-serif;
        background: #f7f7f9;
        color: #222;
    }

    /* Top Navigation */
    .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: white;
        border-bottom: 1px solid #e5e5e5;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .nav .logo {
        font-size: 20px;
        font-weight: 700;
    }

    .nav a {
        margin-left: 22px;
        text-decoration: none;
        color: #444;
        font-weight: 500;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .section {
        background: white;
        padding: 22px;
        border-radius: 14px;
        margin-top: 25px;
        border: 1px solid #e5e5e5;
    }

    .section h2 {
        margin-top: 0;
        font-size: 22px;
    }

    /* Task Input */
    .task-input {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .task-input input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    .task-input button {
        padding: 12px 18px;
        border: none;
        background: #4a6cf7;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
    }

    /* Task List */
    .task-list {
        margin-top: 20px;
    }

    .task-item {
        background: #fafafa;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #ddd;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .task-item button {
        background: #4a6cf7;
        border: none;
        padding: 8px 14px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    /* Focus Mode */
    .focus-box {
        text-align: center;
        padding: 30px;
        border-radius: 14px;
        background: #fdfdfd;
        border: 1px solid #e5e5e5;
        margin-top: 20px;
    }

    .timer {
        font-size: 48px;
        font-weight: 700;
        margin: 20px 0;
    }

    .focus-controls button {
        padding: 12px 20px;
        margin: 8px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
    }

    .start-btn { background: #4a6cf7; color: white; }
    .reset-btn { background: #ddd; }

    /* AI Explode */
    .explode-box {
        margin-top: 20px;
        padding: 20px;
        background: #fefefe;
        border-radius: 14px;
        border: 1px solid #e5e5e5;
    }

    .explode-box textarea {
        width: 100%;
        height: 90px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        resize: none;
        font-size: 15px;
    }

    .explode-box button {
        margin-top: 12px;
        padding: 12px 18px;
        background: #4a6cf7;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
    }

</style>
</head>
<body>

<div class="nav">
    <div class="logo">SyllaStudy AI</div>
    <div>
        <a href="index.html">Dashboard</a>
        <a href="smartnotes.html">SmartNotes</a>
        <a href="taskflow.html" style="font-weight:700;">TaskFlow</a>
        <a href="focus.html">Focus</a>
    </div>
</div>

<div class="container">

    <h1>TaskFlow</h1>
    <p>Manage tasks, enter flow state, and let AI guide your productivity.</p>

    <!-- AI Explode -->
    <div class="section explode-box">
        <h2>AI Explode ⚡</h2>
        <p>Describe a goal and AI will break it into micro‑tasks.</p>
        <textarea id="explodeInput" placeholder="Example: Build my study dashboard..."></textarea>
        <button onclick="aiExplode()">Generate Tasks</button>
    </div>

    <!-- Task List -->
    <div class="section">
        <h2>Tasks</h2>

        <div class="task-input">
            <input id="taskInput" placeholder="Add a task...">
            <button onclick="addTask()">Add</button>
        </div>

        <div id="taskList" class="task-list"></div>
    </div>

    <!-- Focus Mode -->
    <div class="section focus-box">
        <h2>Focus Mode</h2>
        <p>Select a task above to begin a session.</p>

        <div class="timer" id="timer">25:00</div>

        <div class="focus-controls">
            <button class="start-btn" onclick="startTimer()">Start</button>
            <button class="reset-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>

</div>

<script>
/* LocalStorage Task System */
let tasks = JSON.parse(localStorage.getItem("syllaTasks")) || [];

function saveTasks() {
    localStorage.setItem("syllaTasks", JSON.stringify(tasks));
}

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((t, i) => {
        list.innerHTML += `
            <div class="task-item">
                <span>${t}</span>
                <button onclick="startFocus('${t}')">Focus</button>
            </div>
        `;
    });
}

function addTask() {
    const input = document.getElementById("taskInput");
    if (!input.value.trim()) return;
    tasks.push(input.value.trim());
    input.value = "";
    saveTasks();
    renderTasks();
}

/* Focus Mode Timer */
let time = 1500;
let interval;

function startTimer() {
    if (interval) return;
    interval = setInterval(() => {
        time--;
        updateTimer();
        if (time <= 0) {
            clearInterval(interval);
            interval = null;
        }
    }, 1000);
}

function resetTimer() {
    clearInterval(interval);
    interval = null;
    time = 1500;
    updateTimer();
}

function updateTimer() {
    const m = Math.floor(time / 60).toString().padStart(2, "0");
    const s = (time % 60).toString().padStart(2, "0");
    document.getElementById("timer").innerText = `${m}:${s}`;
}

function startFocus(task) {
    alert("Starting focus session for: " + task);
}

/* AI Explode (Frontend placeholder) */
function aiExplode() {
    const goal = document.getElementById("explodeInput").value.trim();
    if (!goal) return;

    // Placeholder — you will connect this to your Vercel API
    alert("AI Explode would break this into tasks:\n\n" + goal);
}

renderTasks();
</script>

</body>
</html>
