<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow • Unified Productivity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pure Monochrome Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: 40px;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.3);
            --accent: #ffffff;
            --bg-dark: #0a0a0c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, rgba(10,10,12,0.9) 0%, rgba(0,0,0,0.95) 100%),
                        url('https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Navigation ── */
        nav {
            height: 72px;
            backdrop-filter: blur(24px);
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 48px; flex-shrink: 0; z-index: 100;
        }
        .logo { font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links a {
            color: white; text-decoration: none; margin-left: 36px;
            font-size: 13px; font-weight: 400; letter-spacing: 0.5px; opacity: 0.5; transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { opacity: 1; }

        /* ── Main Layout ── */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            padding: 48px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel-left { border-right: 1px solid var(--glass-border); }
        .panel-right {
            background: radial-gradient(circle at center, rgba(255,255,255,0.02) 0%, transparent 70%);
            align-items: center; justify-content: center; position: relative;
        }

        /* ── Task Hub (Left) ── */
        .header-title { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; margin-bottom: 8px; }
        .header-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }

        .input-group { display: flex; gap: 12px; margin-bottom: 32px; }
        .input-box {
            flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 16px 20px; color: white; font-size: 15px;
            font-family: inherit; outline: none; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .input-box:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); }
        
        .btn {
            background: var(--accent); color: black; border: none;
            padding: 0 24px; border-radius: 12px; font-weight: 500; font-size: 14px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.15); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: white; border: 1px solid var(--glass-border); }
        .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: white; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 20px; display: flex; align-items: center;
            gap: 16px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .task-card:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.3); transform: translateX(4px); }
        .task-card.active-task { border-color: white; background: rgba(255,255,255,0.08); }
        .task-card.completed { opacity: 0.4; }
        .task-card.completed .task-text { text-decoration: line-through; }

        .check-ring {
            width: 20px; height: 20px; border: 1px solid var(--text-dim);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .task-card:hover .check-ring { border-color: white; }
        .completed .check-ring { background: white; border-color: white; }
        
        .task-info { flex: 1; }
        .task-text { font-size: 15px; font-weight: 400; margin-bottom: 6px; }
        .task-meta { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }

        .btn-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; transition: 0.2s; }
        .task-card:hover .btn-delete { color: white; }

        /* ── Focus Zone (Right) ── */
        .empty-state { text-align: center; color: var(--text-muted); font-weight: 300; }
        .focus-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; animation: fadeIn 0.5s ease; }
        .focus-container.active { display: flex; }

        .focus-task-title { font-size: 24px; font-weight: 300; text-align: center; margin-bottom: 12px; line-height: 1.4; }
        
        .ai-step {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 16px 24px; border-radius: 12px; font-size: 13px; color: var(--text-dim);
            text-align: center; margin-bottom: 40px; width: 100%; backdrop-filter: blur(10px);
        }

        .timer-wrapper { position: relative; width: 320px; height: 320px; margin-bottom: 40px; }
        .timer-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .timer-track { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 2; }
        .timer-progress { fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
        
        .timer-inner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        .timer-display { font-size: 72px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -2px; line-height: 1; }
        
        /* Editable Time Input */
        .time-editor {
            display: flex; align-items: center; gap: 8px; margin-top: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid transparent;
            padding: 4px 12px; border-radius: 20px; transition: 0.3s;
        }
        .time-editor:hover { border-color: var(--glass-border); background: rgba(255,255,255,0.08); }
        .time-input {
            background: transparent; border: none; color: var(--text-dim); font-size: 12px;
            font-family: inherit; width: 30px; text-align: center; outline: none;
            -moz-appearance: textfield;
        }
        .time-input::-webkit-outer-spin-button, .time-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .time-input:focus { color: white; border-bottom: 1px solid white; }
        .time-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }

        .controls { display: flex; gap: 16px; width: 100%; justify-content: center; }
        .controls .btn { padding: 16px 32px; font-size: 15px; border-radius: 100px; min-width: 140px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Spinners & Utilities */
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .spinner.white { border-color: rgba(255,255,255,0.2); border-top-color: #fff; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <div class="logo">Task Flow</div>
    <div class="nav-links">
        <a href="#" class="active">Flow State</a>
        <a href="#">Metrics</a>
        <a href="#">Settings</a>
    </div>
</nav>

<div class="app-container">
    <aside class="panel panel-left">
        <div class="header-title">Cognitive Breakdown</div>
        <div class="header-sub">Define your goal. Let AI sequence it.</div>

        <div class="input-group">
            <input type="text" id="taskInput" class="input-box" placeholder="What needs to be done?">
            <button class="btn" id="explodeBtn" onclick="explodeGoal()">
                <span id="explodeBtnText">Break Down</span>
            </button>
        </div>

        <div class="task-list" id="taskList">
            </div>
    </aside>

    <main class="panel panel-right">
        <div class="empty-state" id="emptyState">
            Select a task from your queue to enter flow state.
        </div>

        <div class="focus-container" id="focusContainer">
            <div class="focus-task-title" id="focusTitle">Task Name</div>
            
            <div class="ai-step" id="aiFirstStep">
                <div class="spinner white" style="margin: 0 auto 8px;"></div>
                Generating frictionless first step...
            </div>

            <div class="timer-wrapper">
                <svg class="timer-svg" viewBox="0 0 320 320">
                    <circle class="timer-track" cx="160" cy="160" r="150"/>
                    <circle class="timer-progress" id="timerProgress" cx="160" cy="160" r="150"/>
                </svg>
                <div class="timer-inner">
                    <div class="timer-display" id="timerDisplay">25:00</div>
                    <div class="time-editor">
                        <input type="number" id="timeEditorInput" class="time-input" min="1" max="180" value="25" onchange="updateTotalTime()">
                        <span class="time-label">Minutes Estimated</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="startBtn" onclick="toggleTimer()">Start Focus</button>
                <button class="btn btn-ghost" onclick="markCurrentTaskDone()">Mark Done</button>
            </div>
        </div>
    </main>
</div>

<script>
    // ── Global State ──
    let tasks = JSON.parse(localStorage.getItem('taskflow_data')) || [];
    let activeTaskId = null;
    
    // Timer State
    let timerInterval = null;
    let totalSeconds = 25 * 60;
    let timeLeft = 25 * 60;
    let isRunning = false;

    const R = 150;
    const CIRCUMFERENCE = 2 * Math.PI * R;
    document.getElementById('timerProgress').style.strokeDasharray = CIRCUMFERENCE;

    // ── Utility ──
    const save = () => localStorage.setItem('taskflow_data', JSON.stringify(tasks));
    const genId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    // ── Core Task Logic ──
    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        
        if (tasks.length === 0) {
            list.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 14px;">Your queue is clear.</div>`;
            return;
        }

        tasks.forEach(t => {
            const el = document.createElement('div');
            el.className = `task-card ${t.completed ? 'completed' : ''} ${t.id === activeTaskId ? 'active-task' : ''}`;
            
            el.innerHTML = `
                <div class="check-ring" onclick="event.stopPropagation(); toggleStatus('${t.id}')">
                    ${t.completed ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
                </div>
                <div class="task-info" onclick="loadFocus('${t.id}')">
                    <div class="task-text">${t.text}</div>
                    <div class="task-meta">${t.time} MIN BLOCK</div>
                </div>
                <button class="btn-delete" onclick="event.stopPropagation(); deleteItem('${t.id}')">✕</button>
            `;
            list.appendChild(el);
        });
    }

    function toggleStatus(id) {
        const t = tasks.find(x => x.id === id);
        if (t) {
            t.completed = !t.completed;
            save();
            renderTasks();
            if(t.completed && id === activeTaskId) resetFocusZone();
        }
    }

    function deleteItem(id) {
        tasks = tasks.filter(x => x.id !== id);
        save();
        renderTasks();
        if(id === activeTaskId) resetFocusZone();
    }

    // Manual Entry
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter' && this.value.trim()) {
            tasks.unshift({ id: genId(), text: this.value.trim(), time: 25, completed: false });
            this.value = '';
            save();
            renderTasks();
        }
    });

    // ── AI Integration ──
    async function explodeGoal() {
        const input = document.getElementById('taskInput');
        const goal = input.value.trim();
        if(!goal) return;

        const btn = document.getElementById('explodeBtn');
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner"></div>`;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'task_explosion', goal: goal })
            });
            const data = await res.json();
            
            if (data.tasks) {
                data.tasks.reverse().forEach(t => {
                    tasks.unshift({ id: genId(), text: t.text, time: t.time || 25, completed: false });
                });
                input.value = '';
                save();
                renderTasks();
            }
        } catch (e) {
            console.error("AI Break down failed");
        } finally {
            btn.disabled = false;
            btn.innerHTML = `Break Down`;
        }
    }

    // ── Focus Zone Logic ──
    async function loadFocus(id) {
        if (isRunning) toggleTimer(); // Pause current if switching
        
        activeTaskId = id;
        const task = tasks.find(x => x.id === id);
        renderTasks(); // update active styling

        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('focusContainer').classList.add('active');
        
        document.getElementById('focusTitle').innerText = task.text;
        document.getElementById('timeEditorInput').value = task.time;
        
        // Setup Timer
        totalSeconds = task.time * 60;
        timeLeft = totalSeconds;
        updateTimerUI();
        document.getElementById('startBtn').innerText = 'Start Focus';

        // Fetch First Step
        const stepEl = document.getElementById('aiFirstStep');
        stepEl.innerHTML = `<div class="spinner white" style="margin: 0 auto 8px;"></div>Generating frictionless first step...`;
        
        try {
            const prompt = `Task: "${task.text}". Give me the absolute simplest, 1-minute "First Step" I should take right now to start. One short sentence. No formatting.`;
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'chat', message: prompt })
            });
            const data = await res.json();
            stepEl.innerHTML = data.reply;
        } catch (e) {
            stepEl.innerHTML = "Open your workspace and dive in.";
        }
    }

    function resetFocusZone() {
        if(isRunning) toggleTimer();
        activeTaskId = null;
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('focusContainer').classList.remove('active');
        renderTasks();
    }

    // Editable Time
    function updateTotalTime() {
        if(isRunning) return; // Prevent edit while running
        const val = parseInt(document.getElementById('timeEditorInput').value) || 25;
        const task = tasks.find(x => x.id === activeTaskId);
        if(task) {
            task.time = val;
            save();
            renderTasks();
        }
        totalSeconds = val * 60;
        timeLeft = totalSeconds;
        updateTimerUI();
    }

    // Timer Engine
    function updateTimerUI() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;

        const progress = totalSeconds > 0 ? timeLeft / totalSeconds : 0;
        document.getElementById('timerProgress').style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    }

    function toggleTimer() {
        const btn = document.getElementById('startBtn');
        if (isRunning) {
            clearInterval(timerInterval);
            isRunning = false;
            btn.innerText = "Resume Focus";
        } else {
            if(timeLeft <= 0) return;
            isRunning = true;
            btn.innerText = "Pause Focus";
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    btn.innerText = "Time Up";
                    // Could add audio chime here
                }
            }, 1000);
        }
    }

    function markCurrentTaskDone() {
        if(activeTaskId) toggleStatus(activeTaskId);
    }

    // Init
    renderTasks();
</script>
</body>
</html>
